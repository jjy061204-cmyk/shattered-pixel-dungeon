###features
levels.features.chasm.chasm=낭떠러지
levels.features.chasm.yes=네. 그렇게 하겠습니다.
levels.features.chasm.no=아니오.  생각을 바꾸었습니다.
levels.features.chasm.jump=정말로 낭떠러지 아래로 뛰어 내리겠습니까? 이렇게 높은 데서 떨어지면 많이 아플 껍니다.
levels.features.chasm.ondeath=당신은 추락사했다...
levels.features.chasm.rankings_desc=폭발로 인해 사망



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=쥐 석상
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=제왕의 베개
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=쥐 대왕을 닮은 석상이다. 누가 만든 걸까?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=이 푹신한 보라색 베개는 당신이 침대로 쓰기엔 너무 작지만, 세상에서 가장 중요한 쥐에게 있어서는 아주 완벽한 크기입니다.

levels.rooms.special.magicalfireroom$eternalfire.desc=녹색으로 밝게 타오르는 마법의 불로 이루어진 빽빽한 벽이 타오르고 있다. 매우 뜨거운 나머지 당신은 이 벽을 지나갈 수 없으며, 가까이 다가가는 모든 것들에 불을 붙이게 될 것이다. 불이 자연스레 꺼질 기미는 보이지 않으며, 불을 끄기 위해 무언가를 사용해야 할 것이다.

levels.rooms.special.sentryroom$sentry.name=붉은 감시탑
levels.rooms.special.sentryroom$sentry.desc=이 새빨간 감시탑은 이 방의 끝에 있는 보물을 지키기 위해 설치된 것 같아 보입니다. 감시탑이 지키고 있는 영역에 발을 들이면 분해 광선을 당신에게 발사합니다.\n\n감시탑은 모든 해로운 효과에 면역이며 투명한 적을 감지하지만, 발사를 시작하기까지 시간이 조금 필요합니다.\n\n마치 던전의 생물들은 보물에 위협이 되지 않는다는 것을 아는 것인지, 감시탑은 당신만을 노리는 것 같습니다.
levels.rooms.special.sentryroom$sentry.discover_hint=이 적은 던전의 어느 장소에서나 등장합니다.

levels.rooms.special.toxicgasroom$toxicvent.name=유독성 배기구
levels.rooms.special.toxicgasroom$toxicvent.desc=몇 년 전에 부주의한 모험가가 이 함정을 촉발시킨 게 틀림없습니다. 함정 자체는 비활성 상태임에도 불구하고 유독 가스를 방 안으로 내뿜으며 멈출 기미가 보이지 않습니다. 이 방을 탐험하려면 가스 피해를 막을 수 있는 방법이 필요합니다.

levels.rooms.special.weakfloorroom$hiddenwell.name=멀리 떨어진 우물
levels.rooms.special.weakfloorroom$hiddenwell.desc=아래층의 우물로 빠져 나올 수 있을 것으로 보인다. 아마 밑에 무언가가 있을지도?

levels.rooms.quest.ambitiousimproom$questentrance.name=금고 입구
levels.rooms.quest.ambitiousimproom$questentrance.desc=이 불길한 구멍은 어떤 고대 드워프 금고로 이어지는 입구인 것 같습니다. 마법 결계가 접근을 막고 있으며, 마치 바닥이 있는 것처럼 그 위를 걸어다닐 수 있습니다.

levels.rooms.quest.blacksmithroom$questentrance.name=광산 입구
levels.rooms.quest.blacksmithroom$questentrance.desc=이 사다리는 대장장이의 공방 바로 밑에 위치한 오래된 광산과 이어져 있다.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=대장간
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=트롤 대장장이가 설치한 작은 대장간이다. 석탄 받침대, 화덕, 그리고 몹시 더러워 보이는 물받이까지 갖춰져 있다.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=의식의 제단
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=어둠의 의식을 행하기 위해 그려진 표식이다. 네 귀퉁이에 각각 양초 하나를 놓을 수 있다.
levels.rooms.quest.ritualsiteroom$table.name=불길한 탁자
levels.rooms.quest.ritualsiteroom$table.desc=이 무거운 탁자는 일종의 고문대로 사용하기 위해 조잡하게 개조된 것 같다.

levels.rooms.quest.massgraveroom$massgravedeco.name=공동묘지
levels.rooms.quest.massgraveroom$massgravedeco.desc=뼈들이 바닥에 어지러이 놓여있다. 무슨 일이 있었던 거지?

levels.rooms.quest.mineentrance$questexit.name=광산 출구
levels.rooms.quest.mineentrance$questexit.desc=이 사다리는 광산의 끝으로, 대장장이의 공방으로 이어져 있다.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=발판
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=이 거대한 발판은 바로 위에 있는 낭떠러지와 크기가 꼭 맞습니다. 이 발판은 금고에 평범하게 들어갈 수 있던 시절에 쓰였던 모종의 승강장치와 관계가 있는 것 같습니다.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=당신이 커다란 방에 발을 들이자, 시간이 느려지는 것이 보이며 임프의 목소리가 들립니다:\n\n"아무래도 네가 금고의 가장 깊은 방에 들어간 것 같아. 내 조각상이 분명 그 앞에 있을 거야! 하지만 거기엔 어떤 끔찍한 함정이나 수호자가 있을 게 틀림없어. 그러니 _더 나아가기 전에 충분히 금고를 탐색하고 준비해야 해!_ 난 네가 정말로 내 보물을 가져와 줬으면 하거든. 네가 죽지 않았으면 좋겠어!
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=당신이 커다란 방에 발을 들이자, 시간이 느려지는 것이 보이며 임프의 목소리가 들립니다:\n\n"아무래도 네가 금고의 가장 깊은 방에 들어간 것 같아. 내 조각상이 분명 그 앞에 있을 거야! 하지만 거기엔 어떤 끔찍한 함정이나 수호자가 있을 게 틀림없어. 그러니 _큰 싸움을 치르기 위해 충분히 강해졌는지 확인해!_ 난 네가 정말로 내 보물을 가져와 줬으면 하거든. 네가 죽지 않았으면 좋겠어!"
levels.rooms.quest.vault.vaultfinalroom.final_warning=당신은 어떤 것이 충전되는 소리를 들었고, 한 발짝 더 나아가면 무언가가 작동할 것 같다!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=거대한 제단
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=이 바닥 타일에 있는 무늬는 감옥에 있던 소환의 제단을 거대하게 확대해 놓은 것 같습니다.\n\n건물 전체에 에너지가 넘쳐 흐르고, 마치 어떤 엄청난 힘이 곧 분출될 것처럼 느껴집니다.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=금화가 여기 바닥에 잔뜩 쌓여 있지만, 금고에서 나갈 때 가져갈 수 없다는 점이 참 아쉽다.

###traps
levels.traps.alarmtrap.name=경보 함정
levels.traps.alarmtrap.alarm=함정이 던전 전체에 울려퍼지는 꿰뚫는 듯한 소리를 내었다!
levels.traps.alarmtrap.desc=이 함정은 시끄러운 경보 장치에 연결된 것 같다. 이것을 작동시키면 현재 층의 모든 것의 주의를 끌게 될 것이다.

levels.traps.blazingtrap.name=불타는 함정
levels.traps.blazingtrap.desc=이 함정에 발을 딛으면 함정에 있는 강력한 화학 혼합물에 불이 붙어 넓은 구역을 불타게 만들 것이다.

levels.traps.burningtrap.name=발화 함정
levels.traps.burningtrap.desc=이 함정을 밟으면 화합물이 발화하여 주변을 불길로 휩쌀 것이다.

levels.traps.chillingtrap.name=냉동 함정
levels.traps.chillingtrap.desc=이 함정이 작동되면, 화합물을 방출하여 주변의 공기를 빠르게 냉각시킬 것이다.

levels.traps.confusiontrap.name=혼란 가스 함정
levels.traps.confusiontrap.desc=이 함정을 작동시키면 이 주변에 혼란 가스가 뿌려질 것이다.

levels.traps.cursingtrap.name=저주 함정
levels.traps.cursingtrap.curse=당신이 장착한 장비가 저주받았다!
levels.traps.cursingtrap.desc=이 함정은 저주받은 장비들과 같은 사악한 마법이 깃들어 있다. 밟는 순간 주변의 아이템 몇개에 저주를 내린다.

levels.traps.disarmingtrap.name=무장 해제 함정
levels.traps.disarmingtrap.disarm=당신의 무기가 어디론가 순간이동해버렸다!
levels.traps.disarmingtrap.desc=이 함정을 작동시키면, 작동시킨 자의 무기를 어디론가 순간이동시켜버린다.

levels.traps.disintegrationtrap.name=분해 함정
levels.traps.disintegrationtrap.one=함정이 당신의 %s을(를) 분해해버렸다!
levels.traps.disintegrationtrap.some=함정이 당신의 %s 중 일부를 분해해버렸다!
levels.traps.disintegrationtrap.ondeath=당신은 분해 함정에 분해되어 죽었다...
levels.traps.disintegrationtrap.desc=이 함정을 작동시키면, 분해 광선으로 가장 가까운 목표를 꿰뚫어 엄청난 피해를 주며, 아이템을 파괴할 것이다.\n\n다행히도 이 장치는 항상 드러나 있다.

levels.traps.distortiontrap.name=왜곡 함정
levels.traps.distortiontrap.desc=근원을 알 수 없는 정체불명의 마법이 걸려있는 이 함정은, 이곳에 출몰하는 모든 종류의 몬스터를 소환할 것이다.

levels.traps.explosivetrap.name=폭발 함정
levels.traps.explosivetrap.desc=이 함정은 폭발 화역과 뇌관으로 이루어져 있다. 밟는 순간 주변에 폭발을 일으킨다.

levels.traps.flashingtrap.name=섬광 함정
levels.traps.flashingtrap.desc=이 함정을 밟으면 강렬한 섬광 분말을 방출시켜 대상을 실명시키고 불구 상태로 만들며 피해를 입힐 것이다.\n\n섬광 분말이 많이 장전되어 있는 탓에 몇 번을 작동해도 망가지지 않을 것이다.

levels.traps.flocktrap.name=양떼 함정
levels.traps.flocktrap.desc=견습 마법사가 장난으로 만들어 놓은 것 같은 함정인 것 같다. 이 함정을 밟으면 마법의 양떼가 주변에 생겨난다.

levels.traps.frosttrap.name=서리 함정
levels.traps.frosttrap.desc=이 함정을 밟으면 화학 반응으로 인해 주변의 넓은 지역의 공기를 급속도로 냉각시킬 것이다.

levels.traps.gatewaytrap.name=통로 함정
levels.traps.gatewaytrap.desc=이 특별한 공간이동 함정은 작동해도 망가지지 않으며 대상을 항상 같은 지점으로 공간이동시킬 것이다.

levels.traps.geysertrap.name=간헐천 함정
levels.traps.geysertrap.desc=이 함정이 작동하면 간헐천에서 물이 뿜어져 나와 근처의 대상을 밀쳐내고, 불로 이루어진 적에게 피해를 입히며, 불을 끄고, 바닥을 물로 뒤덮을 것이다.

levels.traps.gnollrockfalltrap.name=놀제 낙석 함정
levels.traps.gnollrockfalltrap.desc=이 낙석 함정은 일종의 마법 지지대로 만들어져 있다. 이 함정이 작동하게 되면, 주변의 바위들을 느슨하게 만들어 주변 5x5 지역에 즉시 바위를 떨어뜨릴 것이다. 이 지역의 바위들은 상대적으로 약하기 때문에 보통의 낙석 함정과 같은 큰 피해를 입히진 않지만, 방어구가 이 낙석 피해를 막아주진 못 할 것이다. 또한 바리케이드 근처의 천장은 바리케이드에 의해 단단하게 지지되어 있기 때문에, 낙석 함정이 발동해도 바리케이드 근처에는 바위들이 떨어지지 않을 것이다.\n\n_이 함정은 적과 아군을 구분하지 않기 때문에, 당신에게 위협적인 만큼 여기 있는 놀들에게도 위협적일 것이다._

levels.traps.grimtrap.name=음침한 함정
levels.traps.grimtrap.ondeath=당신은 음침한 함정의 공격으로 사망했다...
levels.traps.grimtrap.desc=매우 강력한 파괴 마법이 이 함정에 깃들어 있으며, 가장 건강한 영웅을 제외한 모든 것을 일격사시킬 수 있을 정도다. 함정을 밟게 되면 가장 가까운 캐릭터에게 치명적인 마법을 발사할 것이다.\n\n다행히도 이 장치는 항상 드러나 있다.

levels.traps.grippingtrap.name=쇠덫 함정
levels.traps.grippingtrap.desc=이 함정은 대상의 발을 공격하여 피해를 입히고 이동 속도를 저하시킨다.\n\n간단한 구조 덕분에 몇 번을 작동해도 망가지지 않을 것이다.

levels.traps.guardiantrap.name=수호자 함정
levels.traps.guardiantrap.alarm=함정이 던전 전체에 울려퍼지는 꿰뚫는 듯한 소리를 내었다!
levels.traps.guardiantrap.desc=이 함정은 수상한 마법 장치와 연결되어 있어, 수호자를 소환하고 현재 층의 모든 적에게 당신의 위치를 알린다.
levels.traps.guardiantrap$guardian.name=소환된 수호자
levels.traps.guardiantrap$guardian.desc=이 푸른 영혼은 던전에 있는 바위 수호자의 모습을 빌어 소환된 것 같습니다.
levels.traps.guardiantrap$guardian.desc_weapon=이 형상은 거의 형체가 없지만, 형상이 들고 있는 _%s_만큼은 진짜처럼 보입니다.
levels.traps.guardiantrap$guardian.discover_hint=이 적은 특정한 함정의 효과로 등장합니다.

levels.traps.oozetrap.name=산성 점액 함정
levels.traps.oozetrap.desc=이 함정이 작동되면 산성 점액을 내뿜어 씻어낼 때까지 살을 녹일 것이다.

levels.traps.pitfalltrap.name=낭떠러지 함정
levels.traps.pitfalltrap.triggered_hero=당신 주변의 바닥이 무너지고 있다!
levels.traps.pitfalltrap.triggered=작동된 함정 주변의 바닥이 무너지고 있다!
levels.traps.pitfalltrap.no_pit=이곳에 낭떠러지 함정을 사용하기엔 지반이 너무 단단하다.
levels.traps.pitfalltrap.desc=이 함정은 거대한 다락문과 연결되어 있어, 발동 직후 지반을 무너뜨려 주변에 있는 모든 것을 추락시킬 것이다! 다만 특별히 단단한 지반으로 이루어진 곳에서는 작동하지 않을 것이다.

levels.traps.poisondarttrap.name=독 다트 함정
levels.traps.poisondarttrap.ondeath=독 다트 함정에 의해 죽었다...
levels.traps.poisondarttrap.desc=작은 다트 발사기가 주변에 숨겨져 있다. 함정을 작동시키면 가장 가까운 대상에 독 다트를 발사할 것이다.\n\n다행히도 이 장치는 항상 드러나 있다.

levels.traps.rockfalltrap.name=낙석 함정
levels.traps.rockfalltrap.ondeath=당신은 낙석 함정의 돌에 깔려 죽었다...
levels.traps.rockfalltrap.desc=이 함정은 위쪽에 느슨하게 매여 있는 바위들에 연결되어 있으며, 발동하면 바위가 떨어져 방 전체를 덮칠 것이다! 만약 이 함정이 특정 방 안에 있지 않았다면, 바위는 함정 주변의 일부 공간에만 떨어질 것이다.\n\n다행히도 이 장치는 항상 드러나 있다.

levels.traps.shockingtrap.name=전격 함정
levels.traps.shockingtrap.desc=이 장치에는 강력한 에너지가 응축되어 있는 것 같다. 함정을 작동시키면 주변 지역에 전격을 발생시킬 것이다.

levels.traps.stormtrap.name=폭풍 함정
levels.traps.stormtrap.desc=이 장치에는 어마어마한 에너지가 응축되어 있는 것 같다. 함정을 작동시키면 주변 넓은 지역에 강력한 번개 폭풍을 발생시킬 것이다.

levels.traps.summoningtrap.name=소환 함정
levels.traps.summoningtrap.desc=이 함정을 작동시키면 이 구역에서 출현하는 몇몇 몬스터를 이 자리에 소환한다.

levels.traps.teleportationtrap.name=공간이동 함정
levels.traps.teleportationtrap.desc=이 함정이 작동되면, 함정 근처에 있는 모든 것들이 현재 층의 다른 위치로 공간이동할 것이다.

levels.traps.tengudarttrap.desc=텐구 암살자는 분명 전투에 대비해 왔음이 틀림없습니다. 이 함정이 발동하면 텐구 암살자가 아닌 가장 가까운 대상을 향해 독 다트를 발사합니다.\n\n이 함정은 정말 잘 만들어졌기 때문에 마법의 도움 없이는 함정의 위치를 파악해낼 수 없습니다. 그러나 함정이 막 설치된 순간에는 잠깐이나마 그 위치를 볼 수 있습니다.

levels.traps.toxictrap.name=독가스 함정
levels.traps.toxictrap.desc=이 함정을 밟으면 근처에 독가스 구름을 방출한다.

levels.traps.trap.discover_hint=이 함정은 던전의 무작위 장소에 생성됩니다. 각각의 지역에서 서로 다른 함정이 나타날 수 있습니다.
levels.traps.trap.rankings_desc=%s 에 의해 사망

levels.traps.corrosiontrap.name=부식성 가스 함정
levels.traps.corrosiontrap.desc=이 함정을 밟으면 주변에 치명적인 산성 가스 구름을 방출한다.

levels.traps.warpingtrap.name=순간이동 함정
levels.traps.warpingtrap.desc=이 함정은 공간이동 함정과 비슷하지만, 추가로 대상이 기억하고 있는 현재 층의 구조를 까맣게 잊어버리게 만들 것이다!

levels.traps.weakeningtrap.name=약화 함정
levels.traps.weakeningtrap.desc=이 함정에 깃든 암흑 마법이 함정을 건드린 대상의 에너지를 빼앗아 간다. 그러나 강력한 적은 이 효과에 저항할 것이다.

levels.traps.worndarttrap.name=오래된 다트 함정
levels.traps.worndarttrap.ondeath=낡은 다트 함정에 의해 죽었다...
levels.traps.worndarttrap.desc=작은 다트 발사기가 주변이 숨겨져 있다. 함정을 작동시키면 가장 가까운 대상에게 다트를 발사할 것이다.\n\n오래 방치되어 있어 위험해 보이지도 않고, 숨겨져 있지도 않다.



###levels
levels.cavesbosslevel.wires_name=노출된 전력관
levels.cavesbosslevel.wires_desc=땅이 부분적으로 파여 전력관이 일부 노출되었다. 기계들에게 전력을 공급하던 도관인 것 같다.\n\n전력관에는 지금도 전기가 흐르고 있다. DM-300이 전력관을 밟으면 전력을 흡수할 것이다.
levels.cavesbosslevel.energy_desc=땅바닥에 전기가 흐르고 있어 함부로 밟는 것은 위험하다. _스파크들이 특정 방향으로 끌어당겨지는 것처럼 보이는데..._ 이걸로 전력의 근원지를 알 수 있지 않을까?
levels.cavesbosslevel.gate_name=철문
levels.cavesbosslevel.gate_desc=거대한 철문이 드워프 대도시로 가는 길을 막고 있다. 가운데에 부착된 금속 상자에서 시끄럽게 울리는 소리로 보아, 잠금장치가 주변의 기계들과 연결된 것 같다. 아마도 DM-300을 파괴하면 문이 열릴 수도?
levels.cavesbosslevel.gate_desc_broken=철문은 DM-300과 어떠한 방식으로 연결되어 있었음에 틀림없다. DM-300을 파괴했을 때 같이 폭발했으며, 이제는 그 잔해들만이 남아 있다.
levels.cavesbosslevel.water_desc=주변에 전기가 흐르고 있어 물로 이동하는 것은 안전하지 않다...

levels.citybosslevel.throne_name=왕좌
levels.citybosslevel.throne_desc=드워프 도시를 굽어보는 인상적이고 거대한 왕좌는 지금 권력에 미친 사령술사가 차지하고 있습니다.\n\n왕좌에는 마법 장치와 기계 장치들이 장착되어 있습니다. 드워프 왕이 앉아 있는 동안 추가적인 권능을 제공합니다.
levels.citybosslevel.summoning_name=소환의 제단
levels.citybosslevel.summoning_desc=이 제단의 가운데에는 어둠의 힘으로 발광하는 개방부가 있습니다.\n\n드워프 왕은 이 제단을 통해 사령 마법을 발동하고 하수인을 소환합니다. 제단은 하수인을 소환하기 전에 몇 턴 동안 충전을 해야 하며, 소환되는 하수인의 종류도 보여줍니다.

levels.caveslevel.grass_name=야광 이끼
levels.caveslevel.high_grass_name=야광 버섯
levels.caveslevel.water_name=차가운 물
levels.caveslevel.entrance_desc=위층으로 올라가는 사다리이다.
levels.caveslevel.exit_desc=아랫층으로 내려가는 사다리이다.
levels.caveslevel.high_grass_desc=거대한 버섯이 시야를 가린다.
levels.caveslevel.wall_deco_desc=어떤 광물의 광맥이 이 벽에 있다. 황금일까?
levels.caveslevel.bookshelf_desc=도대체 누가 동굴에서 책 선반이 필요한거지?
levels.caveslevel.region_deco_name=철제 구조물
levels.caveslevel.region_deco_desc=드워프들이 광산을 채굴할 때 썼던 것으로 추정되는 커다란 철제 구조물이다. 자세히 보니 상부에 놓인 것이 광산 수레용 철길 같아 보이기도 하다.

levels.citylevel.water_name=의심스러운 색이 물든 물
levels.citylevel.high_grass_name=만개한 꽃들
levels.citylevel.entrance_desc=위층으로 올라가는 경사로이다.
levels.citylevel.exit_desc=아래층으로 내려가는 경사로이다.
levels.citylevel.deco_desc=몇몇 타일이 빠져 있다.
levels.citylevel.statue_desc=영웅적인 자세를 취하고 있는 드워프의 모습을 본딴 석상이다.
levels.citylevel.bookshelf_desc=각종 분류의 책들이 책장에 가지런히 꽂혀 있다.
levels.citylevel.region_deco_name=불타는 제단
levels.citylevel.region_deco_desc=초록색 마법의 불꽃이 타오르고 있는 높게 솟은 제단이다. 불길이 너무 거세서 마치 고체인 것처럼 보인다.

levels.modernlevel.arrive=정신을 차려 보니 유리와 돌로 된 밝고 시끄러운 도시 한가운데입니다. 거리를 따라 가게 간판들이 환하게 빛나고 있습니다. 여기가 현대 세계인 듯합니다. 바로 앞, 길 건너편의 _금은방_에서 금화를 이 세계의 돈으로 바꿀 수 있을 것 같습니다.
levels.modernlevel.road_name=도로
levels.modernlevel.road_desc=선이 그어진 넓고 평평한 길입니다. 이상하게도 수레나 말은 한 대도 보이지 않습니다.
levels.modernlevel.sidewalk_name=보도
levels.modernlevel.sidewalk_desc=반듯하게 맞춰 깔린 보도블록이 도로를 따라 이어져 있습니다.
levels.modernlevel.shop_floor_name=가게 바닥
levels.modernlevel.shop_floor_desc=티끌 하나 없이 반들반들한 타일 바닥입니다. 가게 안은 공기 자체가 차갑게 식혀진 것처럼 시원합니다.
levels.modernlevel.lamp_name=가로등
levels.modernlevel.lamp_desc=꼭대기에 불이 달린 높은 쇠기둥입니다. 불꽃도 연기도 없이 빛을 냅니다.
levels.modernlevel.fountain_name=분수
levels.modernlevel.fountain_desc=광장 한가운데에서 맑은 물이 퐁퐁 솟아오릅니다. 바닥에서 동전 몇 개가 반짝입니다.
levels.modernlevel.flowerbed_name=화단
levels.modernlevel.flowerbed_desc=작고 정성스럽게 가꾼 화단입니다. 누군가 매일 물을 주는 모양입니다.
levels.modernlevel.wall_name=건물 벽
levels.modernlevel.wall_desc=머리 위 까마득히 높이 솟은, 돌과 유리로 된 매끈한 벽입니다.
levels.modernlevel.sign_name=간판
levels.modernlevel.sign_desc=가게 이름이 적힌 빛나는 간판입니다. 처음 보는 글자인데도 어째서인지 읽을 수 있습니다.
levels.modernlevel.door_name=유리문
levels.modernlevel.door_desc=투명한 유리문입니다. 열릴 때마다 작은 종이 경쾌하게 울립니다.
levels.modernlevel.vending_name=자판기
levels.modernlevel.vending_desc=유리 앞면 너머로 알록달록한 캔과 병이 줄지어 있는, 웅웅거리는 키 큰 상자입니다. 눌러서 _코인을 넣고_ 음료를 뽑을 수 있습니다.
levels.modernlevel.trash_name=쓰레기통
levels.modernlevel.trash_desc=뚜껑이 단정하게 닫힌 초록색 통입니다. 놀랍게도 주변 거리에는 쓰레기 하나 없습니다.
levels.modernlevel.bench_name=벤치
levels.modernlevel.bench_desc=분수를 바라보는 나무 벤치입니다. 모험가들이 앉아서 쉬는 법이 있다면 다리를 쉬기에 딱 좋아 보입니다.
levels.modernlevel.prop_counter_name=계산대
levels.modernlevel.prop_counter_desc=반들반들한 상판이 깔린 계산대입니다.
levels.modernlevel.prop_register_name=포스기
levels.modernlevel.prop_register_desc=초록 숫자가 깜빡이는 화면과 카드 단말기가 놓인 계산대입니다. 금화를 넣을 구멍은 없습니다. 이 거리에서는 코인으로만 계산합니다.
levels.modernlevel.prop_espresso_name=커피 머신
levels.modernlevel.prop_espresso_desc=은빛 커피 머신이 쉭쉭 김을 뿜고 있습니다. 진한 커피 향이 납니다.
levels.modernlevel.prop_fridge_name=음료 냉장고
levels.modernlevel.prop_fridge_desc=유리문 너머로 알록달록한 캔과 병이 줄지어 서 있습니다. 문을 열 때마다 찬 공기가 훅 끼칩니다.
levels.modernlevel.prop_snack_shelf_name=과자 진열대
levels.modernlevel.prop_snack_shelf_desc=바스락거리는 봉지 과자가 가득 쌓여 있습니다. 봉지는 크지만 안에는 공기가 더 많을 것 같습니다.
levels.modernlevel.prop_noodle_shelf_name=컵라면 진열대
levels.modernlevel.prop_noodle_shelf_desc=종이컵에 담긴 마른 국수가 줄지어 있습니다. 뜨거운 물만 부으면 된다고 적혀 있습니다.
levels.modernlevel.prop_med_shelf_name=약 진열대
levels.modernlevel.prop_med_shelf_desc=작은 상자와 병이 가지런히 놓여 있습니다. 모두 정확한 이름표가 붙어 있어서, 던전의 물약과는 영 딴판입니다.
levels.modernlevel.prop_book_shelf_name=서가
levels.modernlevel.prop_book_shelf_desc=똑같은 크기로 인쇄된 책이 빽빽이 꽂혀 있습니다. 손으로 베껴 쓴 책은 한 권도 없습니다.
levels.modernlevel.prop_tool_rack_name=공구 진열판
levels.modernlevel.prop_tool_rack_desc=구멍 뚫린 판에 망치, 렌치, 드라이버, 줄자가 걸려 있습니다. 무기로 쓰기엔 조금 애매합니다.
levels.modernlevel.prop_clothes_rack_name=옷걸이
levels.modernlevel.prop_clothes_rack_desc=색색의 옷이 가지런히 걸려 있습니다. 갑옷처럼 단단해 보이는 옷은 없습니다.
levels.modernlevel.prop_mannequin_name=마네킹
levels.modernlevel.prop_mannequin_desc=얼굴 없는 인형이 멋진 재킷을 입고 서 있습니다. 움직이지는 않는 것 같습니다. 아마도요.
levels.modernlevel.prop_cafe_table_name=카페 탁자
levels.modernlevel.prop_cafe_table_desc=동그란 하얀 대리석 탁자입니다. 마시다 만 커피잔과 케이크 접시가 놓여 있습니다.
levels.modernlevel.prop_kiosk_name=키오스크
levels.modernlevel.prop_kiosk_desc=손가락으로 누르는 빛나는 판입니다. 아무리 눌러 봐도 금화 결제 버튼은 보이지 않습니다.
levels.modernlevel.prop_plant_name=화분
levels.modernlevel.prop_plant_desc=잎이 반질반질한 관엽식물입니다. 던전의 풀과 달리 사람을 휘감으려 하지 않습니다.
levels.modernlevel.prop_magazine_name=잡지 진열대
levels.modernlevel.prop_magazine_desc=웃는 사람들 그림이 표지에 실린 얇은 책들입니다. 마법은 하나도 걸려 있지 않습니다.
levels.modernlevel.prop_cake_showcase_name=케이크 진열장
levels.modernlevel.prop_cake_showcase_desc=유리 너머로 크림 케이크와 초콜릿 케이크가 반짝입니다. 보기만 해도 배가 고파집니다.
levels.modernlevel.prop_armor_stand_name=갑옷 진열대
levels.modernlevel.prop_armor_stand_desc=번쩍이는 투구와 흉갑이 걸린 진열대입니다. '전시용, 만지지 마세요'라는 팻말이 붙어 있습니다.
levels.modernlevel.prop_coffee_bar_name=커피 바
levels.modernlevel.prop_coffee_bar_desc=원두 통과 커피 머신이 놓인 뒤쪽 작업대입니다. 바리스타만 들어갈 수 있습니다.
levels.modernlevel.prop_sign_convenience_name=편의점 간판
levels.modernlevel.prop_sign_convenience_desc=장바구니 그림이 그려진 초록 간판입니다. 밤낮없이 불이 켜져 있습니다.
levels.modernlevel.prop_sign_cafe_name=카페 간판
levels.modernlevel.prop_sign_cafe_desc=김이 나는 커피잔 그림이 그려진 갈색 간판입니다.
levels.modernlevel.prop_sign_pharmacy_name=약국 간판
levels.modernlevel.prop_sign_pharmacy_desc=알약 그림이 그려진 청록색 간판입니다.
levels.modernlevel.prop_sign_bookstore_name=서점 간판
levels.modernlevel.prop_sign_bookstore_desc=펼친 책 그림이 그려진 남색 간판입니다.
levels.modernlevel.prop_sign_hardware_name=철물점 간판
levels.modernlevel.prop_sign_hardware_desc=망치 그림이 그려진 주황 간판입니다.
levels.modernlevel.prop_sign_clothing_name=옷가게 간판
levels.modernlevel.prop_sign_clothing_desc=셔츠 그림이 그려진 보라색 간판입니다.
levels.modernlevel.prop_jewel_counter_name=보석 진열 계산대
levels.modernlevel.prop_jewel_counter_desc=짙은 벨벳 위에 금반지와 진주, 푸른 보석이 놓인 유리 계산대입니다. 유리에는 손자국 하나 없습니다.
levels.modernlevel.prop_jewel_cabinet_name=보석 진열장
levels.modernlevel.prop_jewel_cabinet_desc=따뜻한 조명 아래 목걸이와 손목시계, 반지가 줄지어 반짝입니다. 던전의 반지와 달리 저주는 걸려 있지 않을 것 같습니다.
levels.modernlevel.prop_safe_name=금고
levels.modernlevel.prop_safe_desc=다이얼이 달린 묵직한 강철 금고입니다. 손님들이 바꾼 금화가 이 안에 쌓여 있을 것입니다.
levels.modernlevel.prop_scale_counter_name=저울 계산대
levels.modernlevel.prop_scale_counter_desc=금 무게를 다는 작은 저울과 반짝이는 금괴가 놓인 계산대입니다.
levels.modernlevel.prop_price_board_name=금 시세 전광판
levels.modernlevel.prop_price_board_desc=오늘의 금, 은 시세가 빨갛고 파란 숫자로 깜빡입니다. 금값은 오늘도 올랐습니다.
levels.modernlevel.prop_sign_jewelry_name=금은방 간판
levels.modernlevel.prop_sign_jewelry_desc=금테를 두른 남색 간판에 보석 박힌 반지가 그려져 있습니다.
levels.modernlevel.use_cafe_table_0=의자에 잠깐 앉아 숨을 돌립니다. 던전에서는 이렇게 편하게 앉아 본 적이 없습니다.
levels.modernlevel.use_cafe_table_1=탁자 위에 누군가 두고 간 영수증이 있습니다. 라테 두 잔, 케이크 한 조각.
levels.modernlevel.use_plant_0=잎을 만져 보니 진짜 식물입니다. 누군가 매일 물을 주는 모양입니다.
levels.modernlevel.use_plant_1=화분 흙에 "물은 일주일에 한 번"이라고 적힌 작은 팻말이 꽂혀 있습니다.
levels.modernlevel.use_safe_0=다이얼을 돌려 보지만 꿈쩍도 하지 않습니다. 금은방 주인이 헛기침을 합니다.
levels.modernlevel.use_safe_1=묵직한 금고 문에 귀를 대 보니 금화가 잔뜩 들어 있을 것 같은 기분이 듭니다.
levels.modernlevel.use_price_board_0=오늘의 시세: _금화 1개 = 코인 1개_. 화살표가 계속 위를 가리킵니다.
levels.modernlevel.use_price_board_1=전광판 아래에 "환전 수수료 없음"이라는 작은 글씨가 깜빡입니다.
levels.modernlevel.use_no_clerk_0=점원이 보이지 않습니다. 아무도 없으니 물건을 살 수 없습니다.
levels.modernlevel.use_no_clerk_1=가게가 텅 비어 있습니다. 계산해 줄 사람이 없습니다.
levels.modernlevel.prop_cafe_chair_name=카페 의자
levels.modernlevel.prop_cafe_chair_desc=등받이가 있는 나무 의자입니다. 지나갈 수 있습니다.
levels.modernlevel.prop_tree_name=가로수
levels.modernlevel.prop_tree_desc=잎이 무성한 둥근 나무입니다. 도시 한가운데서도 새소리가 들립니다.
levels.modernlevel.prop_bus_stop_name=버스 정류장
levels.modernlevel.prop_bus_stop_desc=파란 지붕 아래 의자와 노선표가 있는 정류장입니다. 광고판에는 처음 보는 음료가 웃고 있습니다.
levels.modernlevel.prop_fountain_name=분수
levels.modernlevel.prop_fountain_desc=돌 테두리 안에 맑은 물이 찰랑이는 둥근 분수입니다. 바닥에 동전이 반짝입니다. 눌러서 _코인을 던지고 소원을 빌_ 수 있습니다.
levels.modernlevel.use_tree_0=나무 그늘 아래 서니 바람이 시원합니다.
levels.modernlevel.use_tree_1=나무 기둥에 누군가 작은 하트를 새겨 놓았습니다.
levels.modernlevel.use_bus_stop_0=노선표를 한참 들여다보지만, 던전으로 가는 버스는 없습니다.
levels.modernlevel.use_bus_stop_1=정류장 의자에 앉아 기다려 보지만 버스는 오지 않습니다.
levels.modernlevel.fountain_no_coin=분수에 던질 코인이 없습니다.
levels.modernlevel.fountain_wish_0=코인을 던지자 퐁당 소리가 났다. 다음 층에서는 좋은 일이 있기를!
levels.modernlevel.fountain_wish_1=코인이 물속에서 반짝이며 가라앉았다. 무사히 돌아가게 해 주세요.
levels.modernlevel.fountain_wish_2=코인을 던지고 눈을 감았다. 왠지 마음이 가벼워졌다.
levels.modernlevel.fountain_wish_3=코인이 다른 동전들 사이에 내려앉았다. 다들 무슨 소원을 빌었을까?
levels.modernlevel.prop_hydrant_name=소화전
levels.modernlevel.prop_hydrant_desc=빨간 소화전입니다. 앞에는 절대 주차하면 안 됩니다.
levels.modernlevel.use_hydrant_0=꼭지를 돌려 보지만 꿈쩍도 하지 않습니다. 소방관 전용인 모양입니다.
levels.modernlevel.use_hydrant_1=소화전 옆에 강아지 한 마리가 다녀간 흔적이 있습니다.
levels.modernlevel.prop_mailbox_name=우체통
levels.modernlevel.prop_mailbox_desc=둥근 지붕의 빨간 우체통입니다. 편지 넣는 구멍이 입처럼 보입니다.
levels.modernlevel.use_mailbox_0=넣을 편지가 없습니다. 던전에서 편지를 부칠 곳이 있었다면 좋았을 텐데요.
levels.modernlevel.use_mailbox_1=우체통 옆면에 '수거 시간: 오후 3시'라고 적혀 있습니다.
levels.modernlevel.prop_bollard_name=볼라드
levels.modernlevel.prop_bollard_desc=차가 인도로 올라오지 못하게 박아 둔 노란 말뚝입니다.
levels.modernlevel.use_bollard_0=볼라드에 살짝 걸터앉아 봅니다. 생각보다 불편합니다.
levels.modernlevel.use_bollard_1=검은 띠에 누군가 스티커를 붙여 놓았습니다.
levels.modernlevel.prop_planter_name=화단
levels.modernlevel.prop_planter_desc=콘크리트 화분에 알록달록한 꽃이 심겨 있습니다.
levels.modernlevel.use_planter_0=꽃향기가 은은하게 납니다. 던전의 풀과는 냄새부터 다릅니다.
levels.modernlevel.use_planter_1=흙 위에 '꽃을 꺾지 마세요'라는 팻말이 꽂혀 있습니다.
levels.modernlevel.prop_bike_rack_name=자전거 거치대
levels.modernlevel.prop_bike_rack_desc=파란 자전거 한 대가 자물쇠로 묶여 있습니다.
levels.modernlevel.use_bike_rack_0=자물쇠가 단단히 채워져 있습니다. 쇠지렛대가 있어도 이건 남의 물건입니다.
levels.modernlevel.use_bike_rack_1=바퀴에 바람이 조금 빠져 있습니다.
levels.modernlevel.prop_cone_name=라바콘
levels.modernlevel.prop_cone_desc=주황색과 흰색 줄무늬의 교통 고깔입니다.
levels.modernlevel.use_cone_0=고깔을 살짝 밀어 보지만, 공사 중이라 그대로 두기로 합니다.
levels.modernlevel.use_cone_1=고깔 밑에 누가 떨어뜨린 사탕 껍질이 있습니다.
levels.modernlevel.prop_phone_booth_name=공중전화
levels.modernlevel.prop_phone_booth_desc=유리로 둘러싸인 오래된 공중전화 부스입니다.
levels.modernlevel.use_phone_booth_0=수화기를 들어 보지만, 던전에 있는 친구의 번호는 모릅니다.
levels.modernlevel.use_phone_booth_1=동전 반환구에 아무것도 없습니다. 다들 확인하는 모양입니다.
levels.modernlevel.prop_recycle_bins_name=분리수거함
levels.modernlevel.prop_recycle_bins_desc=파랑, 초록, 노랑 세 칸으로 나뉜 분리수거함입니다.
levels.modernlevel.use_recycle_bins_0=캔, 병, 종이를 나눠 버리라고 적혀 있습니다. 던전에는 이런 규칙이 없었습니다.
levels.modernlevel.use_recycle_bins_1=통 안에서 빈 캔이 달그락거립니다.
levels.modernlevel.prop_signpost_name=이정표
levels.modernlevel.prop_signpost_desc=초록 화살표 표지판이 길을 알려 줍니다.
levels.modernlevel.use_signpost_0='광장', '공원', '먹자골목'. 던전으로 가는 길은 적혀 있지 않습니다.
levels.modernlevel.use_signpost_1=표지판 기둥에 분실물 전단지가 붙어 있습니다.
levels.modernlevel.prop_food_cart_name=포장마차
levels.modernlevel.prop_food_cart_desc=빨갛고 하얀 차양 아래 어묵 국물이 김을 내뿜는 노점 수레입니다.
levels.modernlevel.use_food_cart_0=주인이 잠깐 자리를 비웠습니다. 국물 냄새만 맡고 돌아섭니다.
levels.modernlevel.use_food_cart_1='어묵 1개, 떡볶이 1인분'이라는 손글씨 메뉴판이 걸려 있습니다.
levels.modernlevel.prop_parked_car_name=주차된 차
levels.modernlevel.prop_parked_car_desc=반짝이는 파란 승용차입니다. 앞유리에 주차 확인증이 놓여 있습니다.
levels.modernlevel.use_parked_car_0=문이 잠겨 있습니다. 창문에 비친 내 모습이 꽤 지쳐 보입니다.
levels.modernlevel.use_parked_car_1=차 지붕이 햇볕에 데워져 따뜻합니다.
levels.modernlevel.prop_slide_name=미끄럼틀
levels.modernlevel.prop_slide_desc=노란 계단과 파란 미끄럼판이 있는 놀이터 미끄럼틀입니다.
levels.modernlevel.use_slide_0=갑옷을 입고 타기엔 너무 좁아 보입니다.
levels.modernlevel.use_slide_1=미끄럼판 끝에 모래가 조금 쌓여 있습니다.
levels.modernlevel.prop_swing_name=그네
levels.modernlevel.prop_swing_desc=빨간 기둥에 노란 그네 두 개가 매달려 있습니다.
levels.modernlevel.use_swing_0=그네를 살짝 밀어 봅니다. 끼익 소리가 정겹습니다.
levels.modernlevel.use_swing_1=그네 아래 땅이 발자국으로 움푹 파였습니다.
levels.modernlevel.prop_bush_name=덤불
levels.modernlevel.prop_bush_desc=둥글게 다듬은 관목입니다. 분홍 꽃이 몇 송이 피었습니다.
levels.modernlevel.use_bush_0=덤불 속에 숨은 건 아무것도 없습니다. 던전과는 다릅니다.
levels.modernlevel.use_bush_1=벌 한 마리가 꽃 주위를 맴돌고 있습니다.
levels.modernlevel.prop_scooter_name=배달 오토바이
levels.modernlevel.prop_scooter_desc=뒤에 하얀 배달 상자를 실은 빨간 오토바이입니다.
levels.modernlevel.use_scooter_0=열쇠가 꽂혀 있지 않습니다. 배달원은 근처에 있는 모양입니다.
levels.modernlevel.use_scooter_1=배달 상자에서 치킨 냄새가 납니다.
levels.modernlevel.prop_boxes_name=택배 상자
levels.modernlevel.prop_boxes_desc=테이프로 감긴 택배 상자가 쌓여 있습니다.
levels.modernlevel.use_boxes_0=받는 사람 이름을 보니 내 물건은 아닙니다.
levels.modernlevel.use_boxes_1=상자에 '취급 주의' 스티커가 붙어 있습니다.
levels.modernlevel.prop_pay_machine_name=주차 정산기
levels.modernlevel.prop_pay_machine_desc=주차 요금을 내는 파란 기계입니다.
levels.modernlevel.use_pay_machine_0=차가 없으니 낼 요금도 없습니다.
levels.modernlevel.use_pay_machine_1=화면에 '1시간 3,000원'이라고 떠 있습니다.
levels.modernlevel.prop_cart_tteokbokki_name=떡볶이 노점
levels.modernlevel.prop_cart_tteokbokki_desc=빨간 차양 아래 떡볶이 철판과 어묵 국물 통이 김을 내뿜습니다.
levels.modernlevel.prop_cart_fishbread_name=붕어빵 노점
levels.modernlevel.prop_cart_fishbread_desc=파란 차양 아래 붕어 모양 무쇠 틀이 줄지어 있습니다.
levels.modernlevel.prop_cart_skewer_name=꼬치 노점
levels.modernlevel.prop_cart_skewer_desc=노란 차양 아래 숯불 석쇠 위에서 꼬치들이 지글지글 익어 갑니다.
levels.modernlevel.prop_cart_potato_name=군고구마 노점
levels.modernlevel.prop_cart_potato_desc=갈색 차양 옆에 연통 달린 드럼통 화덕이 연기를 뿜습니다.
levels.modernlevel.prop_site_fence_name=공사장 가림막
levels.modernlevel.prop_site_fence_desc=파란 줄이 들어간 하얀 가림막입니다. '안전제일' 띠가 둘러져 있습니다.
levels.modernlevel.prop_barrier_name=차단기
levels.modernlevel.prop_barrier_desc=빨갛고 하얀 줄무늬 차단기입니다. 꼭대기에 주황 경광등이 달려 있습니다.
levels.modernlevel.prop_site_sign_name=공사중 표지판
levels.modernlevel.prop_site_sign_desc=노란 바탕의 공사중 표지판입니다.
levels.modernlevel.prop_sand_pile_name=모래 더미
levels.modernlevel.prop_sand_pile_desc=고운 모래가 수북이 쌓여 있고, 삽 한 자루가 꽂혀 있습니다.
levels.modernlevel.prop_pipes_name=쇠파이프 더미
levels.modernlevel.prop_pipes_desc=은색 쇠파이프가 피라미드처럼 쌓여 있습니다.
levels.modernlevel.prop_mixer_name=시멘트 믹서
levels.modernlevel.prop_mixer_desc=주황색 통이 달린 작은 시멘트 믹서입니다.
levels.modernlevel.prop_porta_toilet_name=간이 화장실
levels.modernlevel.prop_porta_toilet_desc=파란 간이 화장실입니다. 문이 굳게 닫혀 있습니다.
levels.modernlevel.prop_dirt_name=흙바닥
levels.modernlevel.prop_dirt_desc=공사 중이라 파헤쳐진 흙바닥입니다.
levels.modernlevel.prop_excavator_name=굴착기
levels.modernlevel.prop_excavator_desc=노란 소형 굴착기입니다. 삽이 땅에 내려져 있습니다.
levels.modernlevel.use_site_fence_0=가림막 너머로 뭔가를 짓는 소리가 들립니다. 무엇이 생길지는 아직 아무도 모릅니다.
levels.modernlevel.use_site_fence_1=가림막에 '놀이터 새 단장 공사 중'이라는 안내문이 붙어 있습니다.
levels.modernlevel.use_barrier_0=차단기가 출입을 막고 있습니다. 관계자 외 출입 금지.
levels.modernlevel.use_barrier_1=경광등이 깜빡깜빡 빛납니다.
levels.modernlevel.use_site_sign_0='공사중. 불편을 드려 죄송합니다.'
levels.modernlevel.use_site_sign_1=표지판 아래에 완공 예정일이 적혀 있지만, 숫자가 지워져 있습니다.
levels.modernlevel.use_sand_pile_0=모래가 신발에 들어갔습니다.
levels.modernlevel.use_sand_pile_1=삽은 단단히 박혀 있어 빠지지 않습니다.
levels.modernlevel.use_pipes_0=파이프가 차갑고 묵직합니다.
levels.modernlevel.use_pipes_1=파이프 안을 들여다보니 반대편이 동그랗게 보입니다.
levels.modernlevel.use_mixer_0=통 안에 굳은 시멘트가 조금 남아 있습니다.
levels.modernlevel.use_mixer_1=스위치를 찾았지만 전원이 꺼져 있습니다.
levels.modernlevel.use_porta_toilet_0=문을 두드리자 안에서 "사람 있어요!"라는 대답이 들립니다.
levels.modernlevel.use_porta_toilet_1=문에 '청소 완료' 스티커가 붙어 있습니다.
levels.modernlevel.use_excavator_0=운전석이 비어 있습니다. 열쇠는 없습니다.
levels.modernlevel.use_excavator_1=삽 끝에 흙이 잔뜩 묻어 있습니다.

levels.hallslevel.water_name=차가운 용암
levels.hallslevel.grass_name=잉걸불이끼
levels.hallslevel.high_grass_name=잉걸불버섯
levels.hallslevel.statue_name=기둥
levels.hallslevel.water_desc=용암처럼 보이지만, 실제로는 차가워서 만져도 안전할 것이다.
levels.hallslevel.statue_desc=이 기둥은 진짜 인간의 해골로 만들어졌다. 여러 가지 의미로 대단한 기둥이다.
levels.hallslevel.bookshelf_desc=책장 속의 고대 언어로 쓰여진 책이 서서히 불타고 있다.
levels.hallslevel.region_deco_name=돌더미
levels.hallslevel.region_deco_desc=근처 벽이나 천장에서 떨어진 듯한 돌덩어리들이 널부러져 있다.


