levels.level.chasm_desc=바닥을 볼 수 없을 정도로 깊은 낭떠러지다.
levels.level.water_desc=불타고 있을 때에는 물에 뛰어들면 불을 끌 수 있다.
levels.level.entrance_desc=위층으로 올라가는 계단이다.
levels.level.exit_desc=아래층으로 내려가는 계단이다.
levels.level.embers_desc=바닥을 뒤덮고 있는 불씨이다.
levels.level.high_grass_desc=우거진 수풀이 시야를 가린다.
levels.level.locked_door_desc=이 문은 잠겨있어서, 맞는 열쇠가 필요하다.
levels.level.crystal_door_desc=마법 수정으로 만들어진 잠겨 있는 문이다. 문 너머가 보이기는 하지만, 열기 위해서는 수정 열쇠가 필요하다.
levels.level.locked_exit_desc=아래층으로 내려가는 무거운 벽돌 계단이다.
levels.level.barricade_desc=이 나무 장애물은 수 년에 걸쳐 굳건하게 길을 막고 있지만 그 동안 바싹 마른 것 같다. 불이 잘 붙을까?
levels.level.inactive_trap_desc=이 함정은 이전에 작동되어서 더 이상 위험하지 않다.
levels.level.statue_desc=누군가가 이 장소를 꾸미려고 했지만, 확실히 실패한 것 같다.
levels.level.alchemy_desc=이 솥은 마법이 깃든 물로 가득 차 있습니다. 아이템을 넣어 새로운 것을 만들어 보십시오!
levels.level.empty_well_desc=우물이 말랐다.

levels.level$feeling.chasm_title=낭떠러지가 많은 층
levels.level$feeling.water_title=물로 뒤덮인 층
levels.level$feeling.grass_title=잔디로 뒤덮인 층
levels.level$feeling.dark_title=어두운 층
levels.level$feeling.large_title=넓은 층
levels.level$feeling.traps_title=함정이 많은 층
levels.level$feeling.secrets_title=비밀이 많은 층
levels.level$feeling.chasm_desc=당신의 발걸음이 던전에 울려 퍼졌다.
levels.level$feeling.water_desc=당신은 물이 흐르는 소리를 들었다.
levels.level$feeling.grass_desc=당신은 진한 풀 냄새를 맡았다.
levels.level$feeling.dark_desc=당신은 적들이 어둠 속에서 움직이는 것을 들었다...
levels.level$feeling.large_desc=이 층은 유난히 넓은 것 같다.
levels.level$feeling.traps_desc=이 층의 지형은 매우 위험해보인다.
levels.level$feeling.secrets_desc=이 층엔 많은 비밀이 숨겨져 있는 것 같다...

levels.mininglevel.wall_desc=일반적인 벽보다 조금 더 부드러운 암벽이다. 곡괭이로 채굴할 수 있지만 힘이 좀 들고 평소보다 빠르게 배고파질 것이다.
levels.mininglevel.gold_extra_desc=아마도 곡괭이로 채굴할 수 있을 것 같다.
levels.mininglevel.crystal_name=수정 가시
levels.mininglevel.boulder_name=바위
levels.mininglevel.crystal_desc=이 곳에는 크고 다채로운 수정들이 노출되어 있다. 수정은 잘 깨지므로 곡괭이를 사용해 쉽게 부수는 것이 가능하다. 아니면 바로 옆의 무언가를 채광해도 곧바로 부서질 것이다.
levels.mininglevel.boulder_desc=커다란 바위가 길을 막고 있다. 그래도 곡괭이로 부수는 건 어렵지 않아 보인다.
levels.mininglevel.barricade_desc=이 나무 바리케이드는 천장을 지지하기 위한 받침대로서 단단히 고정되어 있다.\n\n아마 놀들이 떨어지는 바위로부터 보호받기 위해 건설한 물건 같다. _바리케이드 근처의 모든 타일은 낙석 함정이나 다른 공격으로부터 보호받고 있다._\n\n다른 바리케이드처럼 불태워 없애 버릴 수 있을 것 같다.

levels.prisonlevel.water_name=깊고 차가운 물
levels.prisonlevel.empty_deco_desc=층에 오래된 피가 얼룩져있다.
levels.prisonlevel.bookshelf_desc=감옥 도서관에서 떼 온 물건 같다. 불이 잘 붙을까?
levels.prisonlevel.region_deco_name=감옥 우리
levels.prisonlevel.region_deco_desc=사람을 가둘 정도의 크기의 철제 우리다. 방법은 모르겠으나 바닥에 고정되어 있어 움직일 수 없다.
levels.prisonlevel.region_deco_alt_name=매달린 우리
levels.prisonlevel.region_deco_alt_desc=사람을 가둘 정도의 크기의 철제 우리다. 낭떠러지 위 천장에 매달려 있다.

levels.sewerlevel.water_name=탁한 물
levels.sewerlevel.empty_deco_desc=노란 이끼가 바닥을 뒤덮었다.
levels.sewerlevel.bookshelf_desc=이 책장은 값싸고 쓸모없는 책들로 가득 차 있다. 불이 잘 붙을까?
levels.sewerlevel.region_deco_name=저장용 통
levels.sewerlevel.region_deco_desc=당신만큼 커다란 크기의 튼튼한 통이다. 무언가가 가득 채워져 있는지 움직일 수가 없다.

levels.vaultlevel$vaultflametrap.name=금고 화염 분사구
levels.vaultlevel$vaultflametrap.desc=이 분사구는 일정한 주기로 초록색 불꽃을 내뿜고 있는 것 같습니다. 화염이 뿜어지기 직전에 약간의 불꽃이 발생하는 것을 볼 수 있습니다. 불꽃은 보통 피할 수 있지만, _화염이나 범위 효과에 저항할 수 있게 해주는 것_또한 효과적으로 불꽃을 피할 수 있게 해 줄 것입니다.



###Tiles
tiles.custom.carpet.name=카펫
tiles.custom.carpet.desc=두꺼운 카펫이 바닥을 덮고 있다. 어떤 처리가 되어 있어 불이 붙지는 않는다.

# 새 도시 기물
levels.modernlevel.prop_bench_name=벤치
levels.modernlevel.prop_bench_desc=나무 널빤지를 쇠 다리에 얹은 길가 벤치입니다. 등받이 칠이 군데군데 벗겨졌습니다.
levels.modernlevel.use_bench_0=잠깐 앉아 숨을 고릅니다. 지나가는 차 소리가 멀게 들립니다.
levels.modernlevel.use_bench_1=벤치 틈에 누가 두고 간 영수증이 끼어 있습니다.
levels.modernlevel.prop_crates_name=음료 상자
levels.modernlevel.prop_crates_desc=빈 병이 든 플라스틱 상자와 골판지 상자가 노점 옆에 쌓여 있습니다.
levels.modernlevel.use_crates_0=병끼리 부딪쳐 짤그랑 소리가 납니다.
levels.modernlevel.use_crates_1=상자에 "반품"이라고 매직으로 적혀 있습니다.
levels.modernlevel.prop_hedge_name=생울타리
levels.modernlevel.prop_hedge_desc=반듯하게 다듬은 회양목 울타리가 공원과 주차장을 나눕니다.
levels.modernlevel.use_hedge_0=잎 사이로 손을 넣자 서늘하고 축축합니다.
levels.modernlevel.use_hedge_1=누군가 울타리 안쪽에 배드민턴 공을 잃어버렸습니다.
levels.modernlevel.prop_lamp_name=가로등
levels.modernlevel.prop_lamp_desc=길 쪽으로 고개를 숙인 회색 가로등입니다. 밤이면 주황빛을 떨어뜨립니다.
levels.modernlevel.use_lamp_0=기둥에 붙은 전단지가 바람에 팔락입니다.
levels.modernlevel.use_lamp_1=기둥 아래쪽에 관리번호 판이 붙어 있습니다.
levels.modernlevel.prop_light_pole_name=전구 기둥
levels.modernlevel.prop_light_pole_desc=포장마차 거리 위로 줄전구를 늘어뜨린 나무 기둥입니다.
levels.modernlevel.use_light_pole_0=머리 위 줄전구가 따뜻하게 깜빡입니다.
levels.modernlevel.use_light_pole_1=기둥에 묶인 전선을 따라 전구들이 이어집니다.
levels.modernlevel.prop_lpg_name=가스통
levels.modernlevel.prop_lpg_desc=노점 화구에 연결된 노란 LPG 통입니다. 함부로 건드리면 안 됩니다.
levels.modernlevel.use_lpg_0=밸브가 단단히 잠겨 있는 것을 확인합니다.
levels.modernlevel.use_lpg_1=통 옆면에 "화기엄금"이라고 붉게 적혀 있습니다.
levels.modernlevel.prop_menu_board_name=메뉴판
levels.modernlevel.prop_menu_board_desc=분필 글씨로 오늘의 메뉴를 적은 칠판 입간판입니다.
levels.modernlevel.use_menu_board_0="떡볶이 3, 어묵 1, 오늘은 국물 무한" 이라고 적혀 있습니다.
levels.modernlevel.use_menu_board_1=맨 아래에 작게 "현금·코인 환영" 이라고 쓰여 있습니다.
levels.modernlevel.prop_parking_booth_name=주차 관리 부스
levels.modernlevel.prop_parking_booth_desc=주차장 입구의 작은 관리 부스입니다. 창문에 블라인드가 반쯤 내려와 있습니다.
levels.modernlevel.use_parking_booth_0=안에서 라디오 소리가 작게 흘러나옵니다.
levels.modernlevel.use_parking_booth_1=창문에 "정산은 무인 정산기를 이용하세요" 라고 붙어 있습니다.
levels.modernlevel.prop_planter_tree_name=화분 나무
levels.modernlevel.prop_planter_tree_desc=광장 바닥에 놓인 둥근 콘크리트 화분과 다듬은 나무입니다.
levels.modernlevel.use_planter_tree_0=화분 가장자리에 걸터앉기 딱 좋은 높이입니다.
levels.modernlevel.use_planter_tree_1=흙 위에 누군가 버린 빨대가 하나 있습니다.
levels.modernlevel.prop_plastic_table_name=포장마차 탁자
levels.modernlevel.prop_plastic_table_desc=둥근 플라스틱 탁자와 목욕탕 의자입니다. 냄비와 초록 병이 올려져 있습니다.
levels.modernlevel.use_plastic_table_0=의자가 생각보다 낮아서 무릎이 높이 올라옵니다.
levels.modernlevel.use_plastic_table_1=탁자 위에 다 먹은 어묵 꼬치가 가지런히 놓여 있습니다.
levels.modernlevel.prop_pond_name=연못
levels.modernlevel.prop_pond_desc=돌테를 두른 작은 연못입니다. 연잎 사이로 잉어 그림자가 지나갑니다.
levels.modernlevel.use_pond_0=물에 손을 담그자 잉어들이 먹이인 줄 알고 몰려듭니다.
levels.modernlevel.use_pond_1=물 위에 동전 몇 개가 반짝입니다. 누군가 소원을 빌었나 봅니다.
levels.modernlevel.prop_street_tree_name=가로수
levels.modernlevel.prop_street_tree_desc=보도 블록 사이 나무 보호 덮개 위로 자란 가로수입니다.
levels.modernlevel.use_street_tree_0=잎 사이로 햇빛이 얼룩덜룩 떨어집니다.
levels.modernlevel.use_street_tree_1=줄기에 누가 새긴 하트 낙서가 희미하게 남아 있습니다.
levels.modernlevel.prop_trash_bin_name=쓰레기통
levels.modernlevel.prop_trash_bin_desc=일반 쓰레기 입구가 하나 달린 회색 쓰레기통입니다.
levels.modernlevel.use_trash_bin_0=안을 들여다보니 컵 커피 빈 컵이 가득합니다.
levels.modernlevel.use_trash_bin_1="분리수거 협조 부탁드립니다" 스티커가 붙어 있습니다.
levels.modernlevel.prop_stall_tteokbokki_name=떡볶이 포장마차
levels.modernlevel.prop_stall_tteokbokki_desc=빨간 천막 아래 떡볶이 철판과 어묵 국물 통이 김을 뿜습니다. 눌러서 메뉴를 볼 수 있습니다.
levels.modernlevel.prop_stall_fishbread_name=붕어빵 포장마차
levels.modernlevel.prop_stall_fishbread_desc=주황 천막 아래 붕어 모양 무쇠 틀이 줄지어 있습니다. 눌러서 메뉴를 볼 수 있습니다.
levels.modernlevel.prop_stall_skewer_name=꼬치 포장마차
levels.modernlevel.prop_stall_skewer_desc=숯불 석쇠 위에서 꼬치들이 지글지글 익어 갑니다. 눌러서 메뉴를 볼 수 있습니다.
levels.modernlevel.prop_stall_potato_name=군고구마 포장마차
levels.modernlevel.prop_stall_potato_desc=드럼통 화덕에서 고구마와 군밤 냄새가 퍼집니다. 눌러서 메뉴를 볼 수 있습니다.
levels.modernlevel.prop_vending_name=자판기
levels.modernlevel.prop_vending_desc=유리 앞면 너머로 알록달록한 캔과 병이 줄지어 있습니다. 눌러서 _코인을 넣고_ 음료를 뽑을 수 있습니다.

levels.prisonbosslevel.rift_name=차원의 균열
levels.prisonbosslevel.rift_desc=텐구가 쓰러지며 뒤틀린 공간이 빈 감방 벽에 보랏빛 틈을 냈습니다. 틈 너머로 낯선 불빛과 자동차 소리가 희미하게 새어 나옵니다. _차원 이동 카드_를 지닌 채 균열에 들어서면 이세계로 건너갈 수 있습니다.
levels.prisonbosslevel.rift_ask=차원 이동 카드가 균열에 반응해 빛나고 있습니다. 카드를 써서 균열 너머로 건너갈까요?
levels.prisonbosslevel.rift_yes=균열로 들어간다
levels.prisonbosslevel.rift_no=그만둔다
levels.prisonbosslevel.rift_no_card=균열이 일렁이지만 몸이 튕겨 나옵니다. 차원 이동 카드가 있어야 건너갈 수 있습니다.
levels.sanctuarylevel.water_name=룬빛 샘
levels.sanctuarylevel.water_desc=바닥까지 비치는 맑은 청록빛 물입니다. 물 밑에 새겨진 룬이 희미하게 빛나고, 수면 위로 작은 빛 알갱이가 천천히 떠오릅니다.
levels.sanctuarylevel.statue_name=고대의 수호상
levels.sanctuarylevel.statue_desc=칼을 짚고 선 기사 모양의 석상입니다. 투구 틈의 룬이 꺼져 있어 지금은 움직이지 않습니다. 드워프의 솜씨와는 전혀 다른, 훨씬 오래된 조각입니다.
levels.sanctuarylevel.bookshelf_name=돌 서판
levels.sanctuarylevel.bookshelf_desc=아무도 읽지 못하는 고대 문자가 빽빽이 새겨진 돌 서판들이 벽감에 꽂혀 있습니다.
levels.sanctuarylevel.grass_name=이끼
levels.sanctuarylevel.grass_desc=오랜 세월 동안 유적의 돌 틈을 뒤덮은 이끼와 고사리입니다. 사이사이 연한 금빛 꽃이 피어 있습니다.
levels.sanctuarylevel.floor_sp_desc=금선으로 칸을 나눈 청록빛 모자이크 바닥입니다. 몇몇 조각은 닳아서 빠져 있습니다.
levels.sanctuarylevel.deco_desc=금 간 판석 틈으로 이끼가 자라 있습니다.
levels.sanctuarylevel.pedestal_desc=금테를 두른 둥근 제단석입니다. 가운데 박힌 청록 보석이 아직 은은하게 빛납니다.
levels.sanctuarylevel.exit_desc=성소 깊은 곳, 수호자의 방으로 이어지는 계단입니다.
levels.sanctuarylevel.entrance_desc=위층으로 올라가는 계단입니다.
levels.sanctuarylevel.region_deco_name=고대의 유물
levels.sanctuarylevel.region_deco_desc=금빛 머릿돌을 얹은 오벨리스크, 혹은 꺼지지 않는 청록 불꽃이 타오르는 화로입니다. 누가 세웠는지는 아무도 모릅니다.
levels.sanctuarylevel.wall_deco_name=룬이 새겨진 벽
levels.sanctuarylevel.wall_deco_desc=벽에 새겨진 고대 룬이 아직도 희미하게 빛을 냅니다.
levels.sanctuarylevel.gate_name=고대의 게이트
levels.sanctuarylevel.gate_desc=이끼 낀 돌 아치 안에서 청록빛 공간이 소용돌이칩니다. 들어가면 20층, 임프의 상점 옆으로 돌아갑니다.
levels.sanctuarylevel.gate_desc_city=임프가 드워프 금고에서 찾아낸 이차원 게이트 장치로 연 문입니다. 아치 안에서 청록빛 공간이 소용돌이치며, 들어가면 _이차원의 성소_로 이어집니다.
levels.sanctuarybosslevel.sealed=등 뒤의 문이 무너져 내린 돌에 막혔습니다!
levels.sanctuarybosslevel.portal_open=수호자가 쓰러지자 투기장 가운데 룬 원 위에 고대의 게이트가 열렸습니다.
levels.sanctuarybosslevel.entrance_desc=성소 1층으로 올라가는 계단입니다.
