levels.level.alchemy_name=Alchemy pot
levels.level.default_name=???
levels.level.chasm_desc=You can't see the bottom.
levels.level.water_desc=In case of burning step into the water to extinguish the fire.
levels.level.entrance_desc=Stairs lead up to the upper depth.
levels.level.exit_desc=Stairs lead down to the lower depth.
levels.level.embers_desc=Embers cover the floor.
levels.level.high_grass_desc=Dense vegetation blocks the view.
levels.level.locked_door_desc=This door is locked, you need a matching key to unlock it.
levels.level.crystal_door_desc=This locked door is made of magical crystal. You can see through, but you'll need a crystal key to open it.
levels.level.locked_exit_desc=Heavy bars block the stairs leading down.
levels.level.barricade_desc=The wooden barricade is firmly set but has dried over the years. Might it burn?
levels.level.inactive_trap_desc=The trap has been triggered before and it's not dangerous anymore.
levels.level.statue_desc=Someone wanted to adorn this place, but failed, obviously.
levels.level.alchemy_desc=This pot is filled with magical water. Items can be mixed into the pot to create something new!
levels.level.empty_well_desc=The well has run dry.

levels.level$feeling.chasm_title=chasm floor
levels.level$feeling.water_title=water floor
levels.level$feeling.grass_title=grass floor
levels.level$feeling.dark_title=dark floor
levels.level$feeling.large_title=large floor
levels.level$feeling.traps_title=traps floor
levels.level$feeling.secrets_title=secrets floor
levels.level$feeling.chasm_desc=Your steps echo across the dungeon.
levels.level$feeling.water_desc=You hear water splashing around you.
levels.level$feeling.grass_desc=The smell of vegetation is thick in the air.
levels.level$feeling.dark_desc=You can hear enemies moving in the darkness.
levels.level$feeling.large_desc=This dungeon floor seems unusually large.
levels.level$feeling.traps_desc=The ground seems especially treacherous here.
levels.level$feeling.secrets_desc=The atmosphere hints that this floor hides many secrets.

levels.mininglevel.wall_desc=A smooth rock wall that's a little softer than usual. You can mine through it with your pickaxe, but it'll take some effort and increase your hunger a bit.
levels.mininglevel.gold_extra_desc=You can probably mine it out with your pickaxe.
levels.mininglevel.crystal_name=Crystal spike
levels.mininglevel.boulder_name=Boulder
levels.mininglevel.crystal_desc=There is a large and colorful crystal outcropping here. These crystals are fragile and can easily be broken with a pickaxe, or will break if something is mined next to it.
levels.mininglevel.boulder_desc=There is a large boulder blocking the way. It should be fairly easy to break with a pickaxe.
levels.mininglevel.barricade_desc=The wooden barricade is firmly set and acts as a support for the ceiling.\n\nThis was probably constructed by the gnolls to give some protection against falling rocks. _Any adjacent cells will be protected from rockfall traps and attacks._\n\nIt looks like it would burn just as well as any other barricade.

levels.prisonlevel.water_name=Dark cold water
levels.prisonlevel.empty_deco_desc=There are old blood stains on the floor.
levels.prisonlevel.bookshelf_desc=This is probably a vestige of a prison library. Might it burn?
levels.prisonlevel.region_deco_name=Prison cage
levels.prisonlevel.region_deco_desc=A metal cage just large enough to hold a person. It seems to be locked to the ground in some way, you can't move it.
levels.prisonlevel.region_deco_alt_name=Hanging cage
levels.prisonlevel.region_deco_alt_desc=A metal cage just large enough to hold a person. It's hanging over a deep chasm, suspended by a chain.

levels.sewerlevel.water_name=Murky water
levels.sewerlevel.empty_deco_desc=Wet yellowish moss covers the floor.
levels.sewerlevel.bookshelf_desc=The bookshelf is packed with cheap useless books. Might it burn?
levels.sewerlevel.region_deco_name=Storage barrel
levels.sewerlevel.region_deco_desc=A stout barrel that's almost as big as you are. It must be full of something or another, it's too heavy to move.

levels.vaultlevel$vaultflametrap.name=vault flame vent
levels.vaultlevel$vaultflametrap.desc=This vent seems to be sending up bursts of green flame at regular intervals. You can see the flames starting to build just before it fires. The flames can usually be avoided, but _anything that lets you resist fire or area-bound effects_ is also effective.



###Tiles
tiles.custom.carpet.name=Carpet
tiles.custom.carpet.desc=Thick carpet covers the floor. It must be treated in some way, it isn't flammable.

# 새 도시 기물
levels.modernlevel.prop_bench_name=bench
levels.modernlevel.prop_bench_desc=A roadside bench of wooden slats on iron legs. Paint is peeling off the backrest.
levels.modernlevel.use_bench_0=You sit for a moment and catch your breath. Traffic hums in the distance.
levels.modernlevel.use_bench_1=Someone left a receipt stuck between the slats.
levels.modernlevel.prop_crates_name=drink crates
levels.modernlevel.prop_crates_desc=Plastic crates of empty bottles and cardboard boxes stacked beside the stalls.
levels.modernlevel.use_crates_0=The bottles clink against each other.
levels.modernlevel.use_crates_1="RETURNS" is scrawled on a box in marker.
levels.modernlevel.prop_hedge_name=hedge
levels.modernlevel.prop_hedge_desc=A neatly trimmed boxwood hedge separating the park from the parking lot.
levels.modernlevel.use_hedge_0=The leaves feel cool and damp.
levels.modernlevel.use_hedge_1=A badminton shuttlecock is stuck deep inside the hedge.
levels.modernlevel.prop_lamp_name=street lamp
levels.modernlevel.prop_lamp_desc=A grey street lamp bowing toward the road. It casts orange light at night.
levels.modernlevel.use_lamp_0=A flyer taped to the pole flutters in the wind.
levels.modernlevel.use_lamp_1=A small ID plate is fixed to the bottom of the pole.
levels.modernlevel.prop_light_pole_name=light pole
levels.modernlevel.prop_light_pole_desc=A wooden pole holding strings of bulbs over the food alley.
levels.modernlevel.use_light_pole_0=The string lights flicker warmly overhead.
levels.modernlevel.use_light_pole_1=The bulbs follow a wire tied to the pole.
levels.modernlevel.prop_lpg_name=gas tank
levels.modernlevel.prop_lpg_desc=A yellow LPG tank hooked up to a stall burner. Best not to touch it.
levels.modernlevel.use_lpg_0=You check that the valve is shut tight.
levels.modernlevel.use_lpg_1="NO OPEN FLAMES" is printed in red on its side.
levels.modernlevel.prop_menu_board_name=menu board
levels.modernlevel.prop_menu_board_desc=A chalkboard sign with today's menu written in chalk.
levels.modernlevel.use_menu_board_0="Tteokbokki 3, fish cake 1, free broth refills today."
levels.modernlevel.use_menu_board_1=At the bottom, in small letters: "Cash and coins welcome."
levels.modernlevel.prop_parking_booth_name=parking booth
levels.modernlevel.prop_parking_booth_desc=A small attendant booth at the lot entrance, blinds half drawn.
levels.modernlevel.use_parking_booth_0=A radio murmurs quietly inside.
levels.modernlevel.use_parking_booth_1=A note on the window says to use the pay machine.
levels.modernlevel.prop_planter_tree_name=planter tree
levels.modernlevel.prop_planter_tree_desc=A trimmed tree in a round concrete planter on the plaza.
levels.modernlevel.use_planter_tree_0=The rim is just the right height to sit on.
levels.modernlevel.use_planter_tree_1=Someone dropped a straw into the soil.
levels.modernlevel.prop_plastic_table_name=street stall table
levels.modernlevel.prop_plastic_table_desc=A round plastic table with low stools. A pot and a green bottle sit on top.
levels.modernlevel.use_plastic_table_0=The stool is lower than expected; your knees stick up.
levels.modernlevel.use_plastic_table_1=Finished fish cake skewers are lined up neatly on the table.
levels.modernlevel.prop_pond_name=pond
levels.modernlevel.prop_pond_desc=A small pond ringed with stones. Carp shadows glide between lily pads.
levels.modernlevel.use_pond_0=Carp crowd toward your hand, hoping for food.
levels.modernlevel.use_pond_1=A few coins glint at the bottom. Someone made a wish.
levels.modernlevel.prop_street_tree_name=street tree
levels.modernlevel.prop_street_tree_desc=A roadside tree growing out of an iron grate in the pavement.
levels.modernlevel.use_street_tree_0=Sunlight filters through the leaves in dapples.
levels.modernlevel.use_street_tree_1=A faint heart is carved into the trunk.
levels.modernlevel.prop_trash_bin_name=trash can
levels.modernlevel.prop_trash_bin_desc=A grey public trash can with a single slot.
levels.modernlevel.use_trash_bin_0=It's full of empty coffee cups.
levels.modernlevel.use_trash_bin_1=A sticker asks you to please sort your recycling.
levels.modernlevel.prop_stall_tteokbokki_name=tteokbokki tent
levels.modernlevel.prop_stall_tteokbokki_desc=A griddle of tteokbokki and a pot of fish cake broth steam under a red tent. Tap to see the menu.
levels.modernlevel.prop_stall_fishbread_name=fish bread tent
levels.modernlevel.prop_stall_fishbread_desc=Rows of fish-shaped iron molds under an orange tent. Tap to see the menu.
levels.modernlevel.prop_stall_skewer_name=skewer tent
levels.modernlevel.prop_stall_skewer_desc=Skewers sizzle on a charcoal grill. Tap to see the menu.
levels.modernlevel.prop_stall_potato_name=sweet potato tent
levels.modernlevel.prop_stall_potato_desc=Roasted sweet potatoes and chestnuts smell wonderful from the drum oven. Tap to see the menu.
levels.modernlevel.prop_vending_name=vending machine
levels.modernlevel.prop_vending_desc=Rows of colorful cans and bottles behind a glass front. Tap it to _insert coins_ and get a drink.

levels.prisonbosslevel.rift_name=dimensional rift
levels.prisonbosslevel.rift_desc=Space twisted as Tengu fell, tearing a violet gap in the wall of an empty cell. Strange lights and the faint sound of cars leak through. Step into the rift while carrying a _dimension card_ to cross over to another world.
levels.prisonbosslevel.rift_ask=Your dimension card glows in response to the rift. Use it to cross over?
levels.prisonbosslevel.rift_yes=Enter the rift
levels.prisonbosslevel.rift_no=Not now
levels.prisonbosslevel.rift_no_card=The rift ripples but pushes you back. You need a dimension card to cross.
levels.sanctuarylevel.water_name=rune spring
levels.sanctuarylevel.water_desc=Clear teal water you can see straight to the bottom of. Runes carved beneath the surface glow faintly, and small motes of light drift upward.
levels.sanctuarylevel.statue_name=ancient guardian statue
levels.sanctuarylevel.statue_desc=A statue of a knight resting both hands on a sword. The rune behind its visor is dark, so it does not move. It is far older than any dwarven work.
levels.sanctuarylevel.bookshelf_name=stone tablets
levels.sanctuarylevel.bookshelf_desc=Stone tablets covered in an ancient script no one can read sit in the wall niches.
levels.sanctuarylevel.grass_name=moss
levels.sanctuarylevel.grass_desc=Moss and ferns that have covered the cracks of these ruins for ages. Pale golden flowers bloom among them.
levels.sanctuarylevel.floor_sp_desc=A teal mosaic floor divided by lines of gold. Some of the tiles have worn away.
levels.sanctuarylevel.deco_desc=Moss grows from a crack in the flagstone.
levels.sanctuarylevel.pedestal_desc=A round altar stone rimmed with gold. The teal gem set in its center still glows softly.
levels.sanctuarylevel.exit_desc=Stairs leading deeper into the sanctuary, to the guardian's chamber.
levels.sanctuarylevel.entrance_desc=Stairs leading up.
levels.sanctuarylevel.region_deco_name=ancient relic
levels.sanctuarylevel.region_deco_desc=An obelisk crowned with a golden capstone, or a brazier burning with a teal flame that never dies. No one knows who raised them.
levels.sanctuarylevel.wall_deco_name=rune-carved wall
levels.sanctuarylevel.wall_deco_desc=Ancient runes carved into the wall still give off a faint light.
levels.sanctuarylevel.gate_name=ancient gate
levels.sanctuarylevel.gate_desc=Teal space swirls inside a mossy stone arch. Stepping in returns you to floor 20, next to the Imp's shop.
levels.sanctuarylevel.gate_desc_city=A gate opened by the interdimensional gate device the Imp found in the dwarven vault. Teal space swirls within the arch; stepping in leads to the _Otherworldly Sanctuary_.
levels.sanctuarybosslevel.sealed=Falling stone seals the door behind you!
levels.sanctuarybosslevel.portal_open=With the guardian fallen, an ancient gate opens over the rune circle in the center of the arena.
levels.sanctuarybosslevel.entrance_desc=Stairs leading up to the sanctuary's first floor.
