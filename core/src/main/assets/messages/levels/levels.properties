###features
levels.features.chasm.chasm=Chasm
levels.features.chasm.yes=Yes, I know what I'm doing
levels.features.chasm.no=No, I changed my mind
levels.features.chasm.jump=Do you really want to jump into the chasm? A fall that far will be painful.
levels.features.chasm.ondeath=You fell to death...
levels.features.chasm.rankings_desc=Died on Impact



###rooms
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_name=Rat Statue
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_name=Regal Pillow
levels.rooms.secret.ratkingroom$ratkingroomdeco.statue_desc=A statue in the likeness of Rat King. Who made this?
levels.rooms.secret.ratkingroom$ratkingroomdeco.pillow_desc=This puffy purple pillow would be too small of a bed for you, but it's the perfect size for the world's most important rat.

levels.rooms.special.magicalfireroom$eternalfire.desc=A wall of dense bright green fire is here, seemingly caused by magic. It's so dense that you can't move through it, and it ignites anything that gets too close. It shows no signs of burning down naturally, you'll need to use something to extinguish it.

levels.rooms.special.sentryroom$sentry.name=red sentry
levels.rooms.special.sentryroom$sentry.desc=This blood-red sentry seems to be positioned here to guard the treasure at the other end of this room. It will fire beams of disintegration magic at you if you step in the area it defends.\n\nIt's immune to all harmful effects and can see through invisibility, but seems to take a while to charge up before it starts firing.\n\nSomehow the sentry only wants to fire on you, as if it knows that the denizens of the dungeon are no threat to the treasure.
levels.rooms.special.sentryroom$sentry.discover_hint=You can find this enemy anywhere in the dungeon.

levels.rooms.special.toxicgasroom$toxicvent.name=toxic vent
levels.rooms.special.toxicgasroom$toxicvent.desc=A careless adventurer must have triggered this trap ages ago. Despite its inactive state, it's still spewing toxic gas into the room and shows no signs of stopping. You'll need some way to prevent damage from the gas if you want to explore this room.

levels.rooms.special.weakfloorroom$hiddenwell.name=Distant well
levels.rooms.special.weakfloorroom$hiddenwell.desc=You can just make out a well in the depths below, perhaps there is something down there?

levels.rooms.quest.ambitiousimproom$questentrance.name=Vault Entrance
levels.rooms.quest.ambitiousimproom$questentrance.desc=This ominous pit seems to be the entrance to some ancient dwarven vault. A magical barrier prevents entry, you can walk over top of it as if there was floor here.

levels.rooms.quest.blacksmithroom$questentrance.name=Mine entrance
levels.rooms.quest.blacksmithroom$questentrance.desc=This ladder leads to an old mine just below the blacksmith's workshop.

levels.rooms.quest.blacksmithroom$smithyvisuals.name=Smithy
levels.rooms.quest.blacksmithroom$smithyvisuals.desc=A little smithy set up by the troll blacksmith, complete with a coal tray, a forge, and a water basin that looks absolutely filthy.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritual marker
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=A painted marker for some dark ritual. Candles are usually placed on the four corners.
levels.rooms.quest.ritualsiteroom$table.name=Ominous Table
levels.rooms.quest.ritualsiteroom$table.desc=This heavy table looks like it was crudely modified into a sort of torture rack.

levels.rooms.quest.massgraveroom$massgravedeco.name=Mass grave
levels.rooms.quest.massgraveroom$massgravedeco.desc=Bones litter the floor, what happened here?

levels.rooms.quest.mineentrance$questexit.name=Mine exit
levels.rooms.quest.mineentrance$questexit.desc=This ladder leads out of the mine, back into the blacksmith's workshop.

levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.name=Platform
levels.rooms.quest.vault.vaultentranceroom$questentranceinternal.desc=This large platform is same size as the pit above you. Probably this platform is involved in some kind of elevator mechanism when the vault is accessed normally.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=As you step into the large room, time seems to slow and you hear the Imp's voice:\n\n"I think you've entered the ultimate chamber of the vault, my statuette should be just beyond! I'm sure there's going to some sort of nasty trap or guardian though, so _you really should explore and prepare before going any further!_ I want you to actually get my prize, not die trying!"
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=As you step into the large room, time seems to slow and you hear the Imp's voice:\n\n"Alright, I think you're in the ultimate chamber of the vault, my statuette should be just beyond! I'm sure there's going to some sort of nasty trap or guardian though, so _make sure you're all powered up and ready for a big fight!_ I want you to actually get my prize, not die trying."
levels.rooms.quest.vault.vaultfinalroom.final_warning=You hear something charging up, one more step forward is going to trigger something!
levels.rooms.quest.vault.vaultfinalroom$markertiles.name=Gigantic marker
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=This pattern in the floor tiles looks like a gigantic version of a summoning marker from the prison.\n\nThe whole floor hums with energy, as if there's some great power just waiting to be unleashed.
levels.rooms.quest.vault.vaultfinalroom$vaulttreasure.desc=Gold is piled on the floor here, it's a shame you can't take it back out of the vault with you.

###traps
levels.traps.alarmtrap.name=alarm trap
levels.traps.alarmtrap.alarm=The trap emits a piercing sound that echoes throughout the dungeon!
levels.traps.alarmtrap.desc=This trap seems to be tied to a loud alarm mechanism. Triggering it will likely alert everything on the level.

levels.traps.blazingtrap.name=blazing trap
levels.traps.blazingtrap.desc=Stepping on this trap will ignite a powerful chemical mixture, setting a wide area ablaze.

levels.traps.burningtrap.name=burning trap
levels.traps.burningtrap.desc=Stepping on this trap will ignite a chemical mixture, setting the surrounding area aflame.

levels.traps.chillingtrap.name=chilling trap
levels.traps.chillingtrap.desc=When activated, chemicals in this trap will rapidly freeze the air around its location.

levels.traps.confusiontrap.name=confusion gas trap
levels.traps.confusiontrap.desc=Triggering this trap will set a cloud of confusion gas loose within the immediate area.

levels.traps.cursingtrap.name=cursing trap
levels.traps.cursingtrap.curse=Your worn equipment becomes cursed!
levels.traps.cursingtrap.desc=This trap contains the same malevolent magic found in cursed equipment. Triggering it will curse some items in the immediate area.

levels.traps.disarmingtrap.name=disarming trap
levels.traps.disarmingtrap.disarm=Your weapon is teleported away!
levels.traps.disarmingtrap.desc=This trap contains very specific teleportation magic, which will warp the weapon of its victim to some other location.

levels.traps.disintegrationtrap.name=disintegration trap
levels.traps.disintegrationtrap.one=The trap disintegrates your %s!
levels.traps.disintegrationtrap.some=The trap disintegrates some of your %s!
levels.traps.disintegrationtrap.ondeath=You were killed by the disintegration trap...
levels.traps.disintegrationtrap.desc=When triggered, this trap will lance the nearest target with beams of disintegration, dealing significant damage and destroying items.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.distortiontrap.name=distortion trap
levels.traps.distortiontrap.desc=Built from strange magic of unknown origin, this trap will summon all manner of creatures to this location.

levels.traps.explosivetrap.name=explosive trap
levels.traps.explosivetrap.desc=This trap contains some powdered explosive and a trigger mechanism. Activating it will cause an explosion in the immediate area.

levels.traps.flashingtrap.name=flashing trap
levels.traps.flashingtrap.desc=On activation, this trap will ignite a potent flashing powder stored within, temporarily blinding, crippling, and injuring its victim.\n\nThe trap must have a large store of powder, as it can activate many times without breaking.

levels.traps.flocktrap.name=flock trap
levels.traps.flocktrap.desc=Perhaps a joke from some amateur mage, triggering this trap will create a flock of magical sheep.

levels.traps.frosttrap.name=frost trap
levels.traps.frosttrap.desc=When activated, chemicals in this trap will rapidly freeze the air in a wide range around its location.

levels.traps.gatewaytrap.name=gateway trap
levels.traps.gatewaytrap.desc=This special teleportation trap can activate an infinite numbers of times and always teleports to the same location.

levels.traps.geysertrap.name=geyser trap
levels.traps.geysertrap.desc=When triggered, this trap will cause a geyser of water to spew forth, damaging fiery enemies, knocking away all nearby characters, dousing fires, and converting the surrounding terrain to water.

levels.traps.gnollrockfalltrap.name=gnoll rockfall trap
levels.traps.gnollrockfalltrap.desc=This rockfall trap is made with some form of magical assistance. When triggered, it will cause rocks to loosen and immediately fall from above in a 5x5 area around it. Due to the softer rocks in the area, it won't deal as much damage as a regular rockfall trap, but your armor also won't be effective against it. Rocks also won't fall in locations with an adjacent barricade, as they help hold the ceiling up.\n\n_This trap can't tell friend from foe, and so is just as harmful to the gnolls as it is to you._

levels.traps.grimtrap.name=grim trap
levels.traps.grimtrap.ondeath=You were killed by the blast of a grim trap...
levels.traps.grimtrap.desc=Extremely powerful destructive magic is stored within this trap, enough to instantly kill all but the healthiest of heroes. Triggering it will send a ranged blast of lethal magic towards the nearest character.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.grippingtrap.name=gripping trap
levels.traps.grippingtrap.desc=This trap latches onto the feet of whoever trigger it, damaging them and slowing their movement.\n\nDue to its simple nature, this trap can activate many times without breaking.

levels.traps.guardiantrap.name=guardian trap
levels.traps.guardiantrap.alarm=The trap emits a piercing sound that echoes throughout the dungeon!
levels.traps.guardiantrap.desc=This trap is tied to a strange magical mechanism, which will summon guardians and alert all enemies on the floor.
levels.traps.guardiantrap$guardian.name=summoned guardian
levels.traps.guardiantrap$guardian.desc=This blue apparition seems to be a summoned echo of one of the dungeon's stone guardians.
levels.traps.guardiantrap$guardian.desc_weapon=While the statue itself is almost incorporeal, the _%s_ it's wielding looks real.
levels.traps.guardiantrap$guardian.discover_hint=You can find this enemy with a specific trap.

levels.traps.oozetrap.name=ooze trap
levels.traps.oozetrap.desc=This trap will splash out caustic ooze when activated, which will burn until it is washed away.

levels.traps.pitfalltrap.name=pitfall trap
levels.traps.pitfalltrap.triggered_hero=The ground starts to give way around you!
levels.traps.pitfalltrap.triggered=The ground starts to give way around the triggered trap!
levels.traps.pitfalltrap.no_pit=the ground is too solid for a pitfall trap to work here.
levels.traps.pitfalltrap.desc=This trap is connected to a large trapdoor mechanism, and shortly after it is triggered anything near it will slip right through the ground and fall! It won't work in areas with especially solid floors though.

levels.traps.poisondarttrap.name=poison dart trap
levels.traps.poisondarttrap.ondeath=You were killed by the poison dart trap...
levels.traps.poisondarttrap.desc=A small dart-blower must be hidden nearby, activating this trap will cause it to shoot a poisoned dart at the nearest target.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.rockfalltrap.name=rockfall trap
levels.traps.rockfalltrap.ondeath=You were crushed by the rockfall trap...
levels.traps.rockfalltrap.desc=This trap is connected to a series of loose rocks above, triggering it will cause them to come crashing down over the entire room! If the trap isn't in a specific room, rocks will fall in an area around the trap instead.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.shockingtrap.name=shocking trap
levels.traps.shockingtrap.desc=A mechanism with a large amount of energy stored into it. Triggering this trap will discharge that energy into a field around it.

levels.traps.stormtrap.name=storm trap
levels.traps.stormtrap.desc=A mechanism with a massive amount of energy stored into it. Triggering this trap will discharge that energy into a large electrical storm.

levels.traps.summoningtrap.name=summoning trap
levels.traps.summoningtrap.desc=Triggering this trap will summon a number of this area's monsters to this location.

levels.traps.teleportationtrap.name=teleportation trap
levels.traps.teleportationtrap.desc=Whenever this trap is triggered, everything around it will be teleported to random locations on this floor.

levels.traps.tengudarttrap.desc=Tengu has clearly been preparing for a fight. This trap will activate a hidden dart blower which will shoot a poison dart at the nearest thing that isn't Tengu.\n\nThe trap is so well made that the trigger mechanism is impossible to detect without magical aid. However the trap is visible for a moment when it is being set.

levels.traps.toxictrap.name=toxic gas trap
levels.traps.toxictrap.desc=Triggering this trap will set a cloud of toxic gas loose within the surrounding area.

levels.traps.trap.discover_hint=You can find this trap randomly in the dungeon. Each region has different traps that may appear.
levels.traps.trap.rankings_desc=Killed by: %s

levels.traps.corrosiontrap.name=corrosive gas trap
levels.traps.corrosiontrap.desc=Triggering this trap will set a cloud of deadly acidic gas loose within the immediate area.

levels.traps.warpingtrap.name=warping trap
levels.traps.warpingtrap.desc=This trap is similar to a teleportation trap, but will also cause the hero to lose their knowledge of the floor's layout!

levels.traps.weakeningtrap.name=weakening trap
levels.traps.weakeningtrap.desc=Dark magic in this trap sucks the energy out of anything that comes into contact with it. Powerful enemies may resist the effect, however.

levels.traps.worndarttrap.name=worn dart trap
levels.traps.worndarttrap.ondeath=You were killed by the worn dart trap...
levels.traps.worndarttrap.desc=A small dart-blower must be hidden nearby, activating this trap will cause it to shoot at the nearest target.\n\nDue to its age it's not very harmful though, it isn't even hidden...



###levels
levels.cavesbosslevel.wires_name=Exposed wiring
levels.cavesbosslevel.wires_desc=The ground is partially dug up here, showing some large exposed wires. They must be connecting the various electrical machines together.\n\nThe wires must have some current running through them. If DM-300 steps here it may be able to draw power from them.
levels.cavesbosslevel.energy_desc=The ground here is sparking with electricity, and is harmful to step on. _The sparks seem to be gravitating in a certain direction..._ perhaps they lead to the power source?
levels.cavesbosslevel.gate_name=Metal gate
levels.cavesbosslevel.gate_desc=A large metal gate that blocks the path into the dwarven metropolis. The metal box in the center is producing a loud humming noise, it must be connected to the circuitry and machines nearby. Perhaps destroying DM-300 will open the gate?
levels.cavesbosslevel.gate_desc_broken=The gate must have been connected to DM-300 in some way, as it exploded when DM-300 was defeated. Now only broken pieces remain.
levels.cavesbosslevel.water_desc=With all the electricity around here water might not always be safe...

levels.citybosslevel.throne_name=Throne
levels.citybosslevel.throne_desc=This impressively large throne is the seat of the dwarven empire, now taken over by a power-mad necromancer.\n\nThere seems to be some magical or mechanical parts to the throne, Dwarf King may have additional power when sitting on it.
levels.citybosslevel.summoning_name=Summoning pedestal
levels.citybosslevel.summoning_desc=This pedestal has a large opening in the center, which is practically radiating with dark energy.\n\nDwarf King uses these pedestals as focal points for his necromantic magic, and can summon minions to them. The pedestal must charge for a few turns before the minion appears, and the type of minion being summoned is telegraphed by the building magical power.

levels.caveslevel.grass_name=Fluorescent moss
levels.caveslevel.high_grass_name=Fluorescent mushrooms
levels.caveslevel.water_name=Freezing cold water
levels.caveslevel.entrance_desc=The ladder leads up to the upper depth.
levels.caveslevel.exit_desc=The ladder leads down to the lower depth.
levels.caveslevel.high_grass_desc=Huge mushrooms block the view.
levels.caveslevel.wall_deco_desc=A vein of some ore is visible on the wall. Gold?
levels.caveslevel.bookshelf_desc=Who would need a bookshelf in a cave?
levels.caveslevel.region_deco_name=Metal structure
levels.caveslevel.region_deco_desc=A large all-metal structure, probably built by the dwarves when they used to mine this place. You think you can see long-unused minecart tracks running along the top.

levels.citylevel.water_name=Suspiciously colored water
levels.citylevel.high_grass_name=High blooming flowers
levels.citylevel.entrance_desc=A ramp leads up to the upper depth.
levels.citylevel.exit_desc=A ramp leads down to the lower depth.
levels.citylevel.deco_desc=Several tiles are missing here.
levels.citylevel.statue_desc=The statue depicts some dwarf standing in a heroic stance.
levels.citylevel.bookshelf_desc=The rows of books on different disciplines fill the bookshelf.
levels.citylevel.region_deco_name=Flaming pedestal
levels.citylevel.region_deco_desc=A raised pedestal with a bright green magical flame atop. The flame is so dense it might as well be solid.

levels.modernlevel.arrive=You come to your senses in the middle of a bright, noisy city of glass and stone. Shop signs glow all along the street. This must be the modern world. The _jeweler_ just across the street looks like a place to exchange your gold for local money.
levels.modernlevel.road_name=road
levels.modernlevel.road_desc=A wide, perfectly flat road with painted lines. Strangely, there are no carts or horses on it.
levels.modernlevel.sidewalk_name=sidewalk
levels.modernlevel.sidewalk_desc=Neatly fitted paving blocks run along the edge of the road.
levels.modernlevel.shop_floor_name=shop floor
levels.modernlevel.shop_floor_desc=Polished, spotless tiles. It is cool inside, as if the air itself were being chilled.
levels.modernlevel.lamp_name=street lamp
levels.modernlevel.lamp_desc=A tall metal post with a light at the top that burns without fire or smoke.
levels.modernlevel.fountain_name=fountain
levels.modernlevel.fountain_desc=Clear water bubbles up in the middle of the square. A few coins glint at the bottom.
levels.modernlevel.flowerbed_name=flower bed
levels.modernlevel.flowerbed_desc=A small, carefully tended flower bed. Someone clearly waters it every day.
levels.modernlevel.wall_name=building wall
levels.modernlevel.wall_desc=A smooth wall of stone and glass that stretches far above your head.
levels.modernlevel.sign_name=shop sign
levels.modernlevel.sign_desc=A glowing sign with the shop's name written in letters you somehow understand.
levels.modernlevel.door_name=glass door
levels.modernlevel.door_desc=A clear glass door. A little bell chimes cheerfully whenever it opens.
levels.modernlevel.vending_name=vending machine
levels.modernlevel.vending_desc=A tall humming box with rows of colorful cans and bottles behind its glass front. Tap it to _insert coins_ and get a drink.
levels.modernlevel.trash_name=trash can
levels.modernlevel.trash_desc=A green bin with a tidy lid. Remarkably, the street around it is spotless.
levels.modernlevel.bench_name=bench
levels.modernlevel.bench_desc=A wooden bench facing the fountain. It looks like a good place to rest your feet, if only adventurers ever sat down.
levels.modernlevel.prop_counter_name=counter
levels.modernlevel.prop_counter_desc=A counter with a polished top.
levels.modernlevel.prop_register_name=cash register
levels.modernlevel.prop_register_desc=A counter with a screen of blinking green numbers and a card terminal. There is no slot for gold coins. Everything on this street is paid for in coins.
levels.modernlevel.prop_espresso_name=coffee machine
levels.modernlevel.prop_espresso_desc=A silver coffee machine hisses steam. It smells strongly of coffee.
levels.modernlevel.prop_fridge_name=drinks cooler
levels.modernlevel.prop_fridge_desc=Rows of colourful cans and bottles stand behind the glass door. A rush of cold air escapes whenever it opens.
levels.modernlevel.prop_snack_shelf_name=snack shelf
levels.modernlevel.prop_snack_shelf_desc=Piles of crinkly snack bags. The bags are big, but they probably hold more air than snacks.
levels.modernlevel.prop_noodle_shelf_name=instant noodle shelf
levels.modernlevel.prop_noodle_shelf_desc=Rows of dried noodles in paper cups. The label says to just add hot water.
levels.modernlevel.prop_med_shelf_name=medicine shelf
levels.modernlevel.prop_med_shelf_desc=Small boxes and bottles in neat rows, every one of them clearly labelled. Nothing like the potions of the dungeon.
levels.modernlevel.prop_book_shelf_name=bookcase
levels.modernlevel.prop_book_shelf_desc=Densely packed books, all printed in exactly the same size. Not a single one was copied by hand.
levels.modernlevel.prop_tool_rack_name=tool rack
levels.modernlevel.prop_tool_rack_desc=A board full of holes, with a hammer, a wrench, a screwdriver and a tape measure hanging on it. Not quite weapons.
levels.modernlevel.prop_clothes_rack_name=clothes rack
levels.modernlevel.prop_clothes_rack_desc=Colourful clothes hang in neat rows. None of them look as sturdy as armor.
levels.modernlevel.prop_mannequin_name=mannequin
levels.modernlevel.prop_mannequin_desc=A faceless figure wearing a stylish jacket. It doesn't seem to move. Probably.
levels.modernlevel.prop_cafe_table_name=cafe table
levels.modernlevel.prop_cafe_table_desc=A round white marble table with an unfinished cup of coffee and a slice of cake on it.
levels.modernlevel.prop_kiosk_name=kiosk
levels.modernlevel.prop_kiosk_desc=A glowing panel you press with your finger. No matter how hard you look, there's no button for paying in gold.
levels.modernlevel.prop_plant_name=potted plant
levels.modernlevel.prop_plant_desc=A glossy-leaved houseplant. Unlike the plants of the dungeon, it isn't trying to grab anyone.
levels.modernlevel.prop_magazine_name=magazine rack
levels.modernlevel.prop_magazine_desc=Thin books with smiling people on their covers. Not a trace of magic in any of them.
levels.modernlevel.prop_cake_showcase_name=cake display
levels.modernlevel.prop_cake_showcase_desc=Cream and chocolate cakes glisten behind the glass. Just looking at them makes you hungry.
levels.modernlevel.prop_armor_stand_name=armor display
levels.modernlevel.prop_armor_stand_desc=A stand holding a shining helmet and breastplate. A small card reads "Display only, please do not touch".
levels.modernlevel.prop_coffee_bar_name=coffee bar
levels.modernlevel.prop_coffee_bar_desc=The back counter with bean jars and a coffee machine. Baristas only.
levels.modernlevel.prop_sign_convenience_name=convenience store sign
levels.modernlevel.prop_sign_convenience_desc=A green sign with a shopping basket on it. It's lit day and night.
levels.modernlevel.prop_sign_cafe_name=cafe sign
levels.modernlevel.prop_sign_cafe_desc=A brown sign with a steaming coffee cup on it.
levels.modernlevel.prop_sign_pharmacy_name=pharmacy sign
levels.modernlevel.prop_sign_pharmacy_desc=A teal sign with a pill on it.
levels.modernlevel.prop_sign_bookstore_name=bookstore sign
levels.modernlevel.prop_sign_bookstore_desc=A navy sign with an open book on it.
levels.modernlevel.prop_sign_hardware_name=hardware store sign
levels.modernlevel.prop_sign_hardware_desc=An orange sign with a hammer on it.
levels.modernlevel.prop_sign_clothing_name=clothing store sign
levels.modernlevel.prop_sign_clothing_desc=A purple sign with a shirt on it.
levels.modernlevel.prop_jewel_counter_name=jewelry counter
levels.modernlevel.prop_jewel_counter_desc=A glass counter displaying gold rings, pearls and blue gems on dark velvet. There isn't a single fingerprint on the glass.
levels.modernlevel.prop_jewel_cabinet_name=jewelry cabinet
levels.modernlevel.prop_jewel_cabinet_desc=Necklaces, wristwatches and rings glitter under warm lights. Unlike dungeon rings, these probably aren't cursed.
levels.modernlevel.prop_safe_name=safe
levels.modernlevel.prop_safe_desc=A heavy steel safe with a combination dial. The gold that customers exchanged must be piled up inside.
levels.modernlevel.prop_scale_counter_name=scale counter
levels.modernlevel.prop_scale_counter_desc=A counter with a small scale for weighing gold, and a shiny gold bar.
levels.modernlevel.prop_price_board_name=gold price board
levels.modernlevel.prop_price_board_desc=Today's gold and silver prices blink in red and blue digits. Gold is up again today.
levels.modernlevel.prop_sign_jewelry_name=jeweler sign
levels.modernlevel.prop_sign_jewelry_desc=A navy sign with a gold border, showing a ring set with a gem.
levels.modernlevel.use_cafe_table_0=You sit down for a moment to catch your breath. You've never sat this comfortably in the dungeon.
levels.modernlevel.use_cafe_table_1=Someone left a receipt on the table: two lattes and a slice of cake.
levels.modernlevel.use_plant_0=You touch a leaf. It's a real plant. Someone must water it every day.
levels.modernlevel.use_plant_1=A little sign in the soil says "water once a week".
levels.modernlevel.use_safe_0=You turn the dial but nothing happens. The jeweler clears their throat.
levels.modernlevel.use_safe_1=You press your ear to the heavy door. It feels like it's full of gold.
levels.modernlevel.use_price_board_0=Today's rate: _1 gold = 1 coin_. The arrow keeps pointing up.
levels.modernlevel.use_price_board_1=Small letters blink under the board: "no exchange fee".
levels.modernlevel.use_no_clerk_0=There's no clerk around. With nobody here, you can't buy anything.
levels.modernlevel.use_no_clerk_1=The shop is empty. There's nobody to ring you up.
levels.modernlevel.prop_cafe_chair_name=cafe chair
levels.modernlevel.prop_cafe_chair_desc=A wooden chair with a backrest. You can walk past it.
levels.modernlevel.prop_tree_name=street tree
levels.modernlevel.prop_tree_desc=A leafy round tree. You can hear birds even in the middle of the city.
levels.modernlevel.prop_bus_stop_name=bus stop
levels.modernlevel.prop_bus_stop_desc=A bus stop with a bench and a route map under a blue roof. A drink you've never seen smiles from the ad board.
levels.modernlevel.prop_fountain_name=fountain
levels.modernlevel.prop_fountain_desc=A round fountain of clear water inside a stone rim. Coins glitter on the bottom. Tap it to _toss a coin and make a wish_.
levels.modernlevel.use_tree_0=The breeze is cool in the shade of the tree.
levels.modernlevel.use_tree_1=Someone carved a little heart into the trunk.
levels.modernlevel.use_bus_stop_0=You study the route map for a while, but no bus goes to the dungeon.
levels.modernlevel.use_bus_stop_1=You sit and wait, but no bus comes.
levels.modernlevel.fountain_no_coin=You have no coin to toss into the fountain.
levels.modernlevel.fountain_wish_0=Plop! You hope something good happens on the next floor.
levels.modernlevel.fountain_wish_1=The coin glitters as it sinks. Let me get home safely.
levels.modernlevel.fountain_wish_2=You toss the coin and close your eyes. Somehow you feel lighter.
levels.modernlevel.fountain_wish_3=The coin settles among the others. What did everyone wish for?
levels.modernlevel.prop_hydrant_name=fire hydrant
levels.modernlevel.prop_hydrant_desc=A red fire hydrant. Never park in front of it.
levels.modernlevel.use_hydrant_0=You try the valve, but it won't budge. Firefighters only, apparently.
levels.modernlevel.use_hydrant_1=A little dog has clearly visited this hydrant.
levels.modernlevel.prop_mailbox_name=mailbox
levels.modernlevel.prop_mailbox_desc=A red mailbox with a rounded top. The letter slot looks like a mouth.
levels.modernlevel.use_mailbox_0=You have no letter to send. If only the dungeon had a post office.
levels.modernlevel.use_mailbox_1=The side says 'Pickup: 3 PM'.
levels.modernlevel.prop_bollard_name=bollard
levels.modernlevel.prop_bollard_desc=A yellow post that keeps cars off the sidewalk.
levels.modernlevel.use_bollard_0=You perch on the bollard for a moment. It's less comfortable than it looks.
levels.modernlevel.use_bollard_1=Someone stuck a sticker on its black band.
levels.modernlevel.prop_planter_name=planter
levels.modernlevel.prop_planter_desc=Colorful flowers in a concrete planter.
levels.modernlevel.use_planter_0=A faint floral scent. Nothing like dungeon grass.
levels.modernlevel.use_planter_1=A sign in the soil says 'Please don't pick the flowers'.
levels.modernlevel.prop_bike_rack_name=bike rack
levels.modernlevel.prop_bike_rack_desc=A blue bicycle locked to the rack.
levels.modernlevel.use_bike_rack_0=It's firmly locked. Even with a crowbar, it's someone else's bike.
levels.modernlevel.use_bike_rack_1=One tire is a little flat.
levels.modernlevel.prop_cone_name=traffic cone
levels.modernlevel.prop_cone_desc=An orange and white striped traffic cone.
levels.modernlevel.use_cone_0=You nudge it, then decide to leave the roadwork alone.
levels.modernlevel.use_cone_1=There's a candy wrapper under the cone.
levels.modernlevel.prop_phone_booth_name=phone booth
levels.modernlevel.prop_phone_booth_desc=An old glass phone booth.
levels.modernlevel.use_phone_booth_0=You pick up the receiver, but you don't know any numbers in the dungeon.
levels.modernlevel.use_phone_booth_1=The coin return is empty. Everyone checks, it seems.
levels.modernlevel.prop_recycle_bins_name=recycling bins
levels.modernlevel.prop_recycle_bins_desc=Recycling bins in blue, green and yellow.
levels.modernlevel.use_recycle_bins_0=Cans, bottles and paper go in separate bins. The dungeon never had rules like this.
levels.modernlevel.use_recycle_bins_1=Empty cans rattle inside.
levels.modernlevel.prop_signpost_name=signpost
levels.modernlevel.prop_signpost_desc=Green arrow signs point the way.
levels.modernlevel.use_signpost_0='Plaza', 'Park', 'Food Alley'. No sign for the dungeon.
levels.modernlevel.use_signpost_1=A lost-and-found flyer is taped to the post.
levels.modernlevel.prop_food_cart_name=food cart
levels.modernlevel.prop_food_cart_desc=A street cart under a red and white awning, steam rising from a pot of fish cake soup.
levels.modernlevel.use_food_cart_0=The owner stepped away. You just enjoy the smell.
levels.modernlevel.use_food_cart_1=A handwritten menu reads 'fish cake, tteokbokki'.
levels.modernlevel.prop_parked_car_name=parked car
levels.modernlevel.prop_parked_car_desc=A shiny blue car with a parking permit on the dashboard.
levels.modernlevel.use_parked_car_0=It's locked. Your reflection in the window looks pretty tired.
levels.modernlevel.use_parked_car_1=The roof is warm from the sun.
levels.modernlevel.prop_slide_name=slide
levels.modernlevel.prop_slide_desc=A playground slide with yellow steps and a blue chute.
levels.modernlevel.use_slide_0=It looks too narrow to ride in armor.
levels.modernlevel.use_slide_1=A little sand has piled up at the bottom.
levels.modernlevel.prop_swing_name=swing set
levels.modernlevel.prop_swing_desc=Two yellow swings hanging from a red frame.
levels.modernlevel.use_swing_0=You give a swing a little push. The creak is oddly comforting.
levels.modernlevel.use_swing_1=The ground under the swings is worn into a dip.
levels.modernlevel.prop_bush_name=bush
levels.modernlevel.prop_bush_desc=A neatly trimmed shrub with a few pink flowers.
levels.modernlevel.use_bush_0=Nothing hides in this bush. Unlike the dungeon.
levels.modernlevel.use_bush_1=A bee circles the flowers.
levels.modernlevel.prop_scooter_name=delivery scooter
levels.modernlevel.prop_scooter_desc=A red scooter with a white delivery box on the back.
levels.modernlevel.use_scooter_0=No key. The rider must be nearby.
levels.modernlevel.use_scooter_1=The delivery box smells like fried chicken.
levels.modernlevel.prop_boxes_name=parcels
levels.modernlevel.prop_boxes_desc=A stack of taped-up parcels.
levels.modernlevel.use_boxes_0=The labels aren't addressed to you.
levels.modernlevel.use_boxes_1=A 'Handle with care' sticker is on top.
levels.modernlevel.prop_pay_machine_name=parking meter
levels.modernlevel.prop_pay_machine_desc=A blue machine for paying parking fees.
levels.modernlevel.use_pay_machine_0=You have no car, so no fee.
levels.modernlevel.use_pay_machine_1=The screen reads '1 hour: 3,000 won'.
levels.modernlevel.prop_cart_tteokbokki_name=tteokbokki stall
levels.modernlevel.prop_cart_tteokbokki_desc=A griddle of tteokbokki and a pot of fish cake broth steam under a red awning.
levels.modernlevel.prop_cart_fishbread_name=fish bread stall
levels.modernlevel.prop_cart_fishbread_desc=Rows of fish-shaped iron molds under a blue awning.
levels.modernlevel.prop_cart_skewer_name=skewer stall
levels.modernlevel.prop_cart_skewer_desc=Skewers sizzle on a charcoal grill under a yellow awning.
levels.modernlevel.prop_cart_potato_name=sweet potato stall
levels.modernlevel.prop_cart_potato_desc=A drum oven with a chimney puffs smoke beside a brown awning.
levels.modernlevel.prop_site_fence_name=construction hoarding
levels.modernlevel.prop_site_fence_desc=White hoarding with blue stripes and a 'Safety First' band.
levels.modernlevel.prop_barrier_name=barricade
levels.modernlevel.prop_barrier_desc=A red and white striped barricade with orange warning lights on top.
levels.modernlevel.prop_site_sign_name=work zone sign
levels.modernlevel.prop_site_sign_desc=A yellow work zone sign.
levels.modernlevel.prop_sand_pile_name=sand pile
levels.modernlevel.prop_sand_pile_desc=A heap of fine sand with a shovel stuck in it.
levels.modernlevel.prop_pipes_name=pipe stack
levels.modernlevel.prop_pipes_desc=Silver steel pipes stacked in a pyramid.
levels.modernlevel.prop_mixer_name=cement mixer
levels.modernlevel.prop_mixer_desc=A small cement mixer with an orange drum.
levels.modernlevel.prop_porta_toilet_name=portable toilet
levels.modernlevel.prop_porta_toilet_desc=A blue portable toilet. The door is firmly shut.
levels.modernlevel.prop_dirt_name=dirt
levels.modernlevel.prop_dirt_desc=Dug-up ground at the construction site.
levels.modernlevel.prop_excavator_name=excavator
levels.modernlevel.prop_excavator_desc=A small yellow excavator, bucket resting on the ground.
levels.modernlevel.use_site_fence_0=You hear building sounds behind the hoarding. Nobody knows what it'll become yet.
levels.modernlevel.use_site_fence_1=A notice reads 'Playground renovation in progress'.
levels.modernlevel.use_barrier_0=The barricade blocks the way. Authorized personnel only.
levels.modernlevel.use_barrier_1=The warning lights blink.
levels.modernlevel.use_site_sign_0='Work in progress. Sorry for the inconvenience.'
levels.modernlevel.use_site_sign_1=The completion date under the sign has been scratched out.
levels.modernlevel.use_sand_pile_0=Sand gets into your shoes.
levels.modernlevel.use_sand_pile_1=The shovel is stuck fast.
levels.modernlevel.use_pipes_0=The pipes are cold and heavy.
levels.modernlevel.use_pipes_1=You peek through a pipe and see a little circle of light.
levels.modernlevel.use_mixer_0=A bit of hardened cement is left in the drum.
levels.modernlevel.use_mixer_1=You find the switch, but the power is off.
levels.modernlevel.use_porta_toilet_0=You knock and hear "Occupied!" from inside.
levels.modernlevel.use_porta_toilet_1=A 'Cleaned' sticker is on the door.
levels.modernlevel.use_excavator_0=The cab is empty. No key.
levels.modernlevel.use_excavator_1=The bucket is caked with dirt.

levels.hallslevel.water_name=Cold lava
levels.hallslevel.grass_name=Embermoss
levels.hallslevel.high_grass_name=Emberfungi
levels.hallslevel.statue_name=Pillar
levels.hallslevel.water_desc=It looks like lava, but it's cold and probably safe to touch.
levels.hallslevel.statue_desc=The pillar is made of real humanoid skulls. Awesome.
levels.hallslevel.bookshelf_desc=Books in ancient languages smoulder in the bookshelf.
levels.hallslevel.region_deco_name=Chunk of rubble
levels.hallslevel.region_deco_desc=A huge piece of stone that seems to have broken off from the ceiling or a nearby wall.


levels.level.hidden_trap=A hidden %s activates!
